/* =====================================================================
   SHATTERED CROWN: LEGION OF ASH
   Single-file canvas RTS. Every pixel of UI is drawn on the canvas.
   Sections: utils · config · audio (SFX) · voice (ElevenLabs + synth)
             · state · units (rig, brains, combat) · projectiles · FX
             · enemy AI · camera/input · background · HUD · screens · loop

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const smooth = t => t * t * (3 - 2 * t);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const FONT = '"Cinzel", "Trajan Pro", Georgia, serif';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }
};
// seeded RNG for deterministic scenery
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
// two-bone IK: returns the middle joint and the (reach-clamped) end point
function ik(ax, ay, bx, by, l1, l2, bend) {
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  const maxD = l1 + l2 - 0.01;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
  if (d < 0.01) d = 0.01;
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const base = Math.atan2(dy, dx) + bend * a;
  return { jx: ax + Math.cos(base) * l1, jy: ay + Math.sin(base) * l1, ex: ax + dx, ey: ay + dy };
}
// keyframe sampler: frames = [[t, v1, v2, ...], ...]
function kf(frames, t) {
  if (t <= frames[0][0]) return frames[0].slice(1);
  for (let i = 1; i < frames.length; i++) {
    if (t <= frames[i][0]) {
      const a = frames[i - 1], b = frames[i], k = smooth((t - a[0]) / (b[0] - a[0] || 1));
      const out = [];
      for (let j = 1; j < a.length; j++) out.push(a[j] + (b[j] - a[j]) * k);
      return out;
    }
  }
  return frames[frames.length - 1].slice(1);
}
const DEG = Math.PI / 180;
const wAng = (f, a) => f > 0 ? a : Math.PI - a;     // local angle (0 = forward, - = up) → world
function distSeg(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
  const t = clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1);
  return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
}

// ---------------------------------------------------------------- audio (Web Audio synth SFX)
const AudioSys = {
  ctx: null, master: null, sfx: null, voiceBus: null, analyser: null, synthAnalyser: null, noise: null,
  muted: store.get('sc_mute', '0') === '1', lastPlay: {},
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9; this.master.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.master);
    // voice path: source → EQ → voiceBus → analyser → master
    this.analyser = c.createAnalyser(); this.analyser.fftSize = 256; this.analyser.smoothingTimeConstant = 0.72;
    this.analyser.connect(this.master);
    const low = c.createBiquadFilter(); low.type = 'lowshelf'; low.frequency.value = 180; low.gain.value = 5;
    this.voiceBus = c.createGain(); this.voiceBus.gain.value = 1.15;
    low.connect(this.voiceBus); this.voiceBus.connect(this.analyser); this.voiceIn = low;
    // silent analyser used to visualise the synth (speechSynthesis can't be tapped)
    this.synthAnalyser = c.createAnalyser(); this.synthAnalyser.fftSize = 256; this.synthAnalyser.smoothingTimeConstant = 0.6;
    const mute = c.createGain(); mute.gain.value = 0; this.synthAnalyser.connect(mute); mute.connect(c.destination);
    const len = c.sampleRate; const b = c.createBuffer(1, len, c.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
  },
  setMuted(m) { this.muted = m; store.set('sc_mute', m ? '1' : '0'); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05); if (m && window.speechSynthesis) speechSynthesis.cancel(); },
  ok(name, gap = 0.04) {
    if (!this.ctx || this.muted) return false;
    const t = this.ctx.currentTime;
    if (this.lastPlay[name] && t - this.lastPlay[name] < gap) return false;
    this.lastPlay[name] = t; return true;
  },
  tone(type, f0, f1, dur, vol, when = 0, dest) {
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.02);
  },
  noiseHit(dur, vol, type, freq, q = 1, when = 0, freq1) {
    const c = this.ctx, t = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = this.noise; s.playbackRate.value = rand(0.8, 1.2);
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (freq1) f.frequency.exponentialRampToValueAtTime(freq1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t, rand(0, 0.5)); s.stop(t + dur + 0.02);
  }
};
// positional volume: quieter when far from the camera centre
function near(x) { const cx = cam.x + VW / 2; const d = Math.abs(x - cx); return d > VW * 1.1 ? 0 : clamp(1.15 - d / (VW * 0.95), 0.12, 1); }
const SFX = {
  ui() { if (AudioSys.ok('ui', 0.03)) { AudioSys.tone('sine', 520, 880, 0.07, 0.18); AudioSys.tone('triangle', 1320, 1320, 0.05, 0.05, 0.02); } },
  deny() { if (AudioSys.ok('deny', 0.12)) AudioSys.tone('square', 160, 110, 0.16, 0.08); },
  clash(x) { const v = near(x); if (!v || !AudioSys.ok('clash', 0.05)) return; AudioSys.noiseHit(0.07, 0.35 * v, 'highpass', 2400, 0.7); AudioSys.tone('triangle', rand(1700, 2100), 1500, 0.28, 0.09 * v); AudioSys.tone('sine', rand(2600, 3100), 2400, 0.2, 0.05 * v); },
  slash(x) { const v = near(x); if (!v || !AudioSys.ok('slash', 0.05)) return; AudioSys.noiseHit(0.14, 0.16 * v, 'bandpass', 700, 1.4, 0, 2800); },
  flesh(x) { const v = near(x); if (!v || !AudioSys.ok('flesh', 0.04)) return; AudioSys.noiseHit(0.09, 0.3 * v, 'lowpass', 900, 1); AudioSys.tone('sine', 170, 70, 0.1, 0.18 * v); },
  bow(x) { const v = near(x); if (!v || !AudioSys.ok('bow', 0.06)) return; AudioSys.tone('triangle', 240, 95, 0.16, 0.2 * v); AudioSys.noiseHit(0.05, 0.12 * v, 'highpass', 3000, 1); },
  thunk(x) { const v = near(x); if (!v || !AudioSys.ok('thunk', 0.05)) return; AudioSys.tone('sine', 220, 90, 0.07, 0.12 * v); AudioSys.noiseHit(0.04, 0.1 * v, 'bandpass', 1400, 2); },
  chime() { if (!AudioSys.ok('chime', 0.08)) return; AudioSys.tone('sine', 1318, 1318, 0.7, 0.16); AudioSys.tone('sine', 1975, 1975, 0.55, 0.09, 0.03); AudioSys.tone('triangle', 2637, 2637, 0.35, 0.04, 0.06); },
  clink(x) { const v = x === undefined ? 1 : near(x); if (!v || !AudioSys.ok('clink', 0.05)) return; AudioSys.tone('sine', 2350, 2350, 0.14, 0.12 * v); AudioSys.tone('sine', 3150, 3150, 0.18, 0.08 * v, 0.06); AudioSys.tone('sine', 2800, 2800, 0.16, 0.06 * v, 0.12); },
  pick(x) { const v = near(x); if (!v || !AudioSys.ok('pick', 0.06)) return; AudioSys.noiseHit(0.05, 0.16 * v, 'highpass', 1800, 1); AudioSys.tone('square', 980, 700, 0.05, 0.03 * v); },
  slam(x) { const v = Math.max(0.35, near(x)); if (!AudioSys.ok('slam', 0.1)) return; AudioSys.tone('sine', 85, 28, 0.6, 0.55 * v); AudioSys.noiseHit(0.45, 0.45 * v, 'lowpass', 520, 0.8, 0, 120); AudioSys.tone('triangle', 140, 50, 0.3, 0.2 * v); },
  stone(x) { const v = near(x); if (!v || !AudioSys.ok('stone', 0.07)) return; AudioSys.noiseHit(0.16, 0.22 * v, 'bandpass', 380, 1.2); AudioSys.tone('sine', 110, 60, 0.14, 0.12 * v); },
  death(x) { const v = near(x); if (!v || !AudioSys.ok('death', 0.08)) return; AudioSys.tone('sawtooth', 190, 70, 0.22, 0.05 * v); },
  horn() { if (!AudioSys.ok('horn', 0.2)) return; [0, 0.18].forEach((w, i) => { AudioSys.tone('sawtooth', i ? 165 : 110, i ? 160 : 108, 0.55, 0.07, w); }); },
  spawn() { if (AudioSys.ok('spawn', 0.1)) { AudioSys.tone('triangle', 330, 440, 0.12, 0.08); AudioSys.tone('sine', 660, 660, 0.1, 0.04, 0.06); } },
  crumble() { if (!AudioSys.ok('crumble', 0.3)) return; AudioSys.noiseHit(1.6, 0.6, 'lowpass', 700, 0.7, 0, 60); AudioSys.tone('sine', 60, 22, 1.8, 0.6); },
  fanfare(win) {
    if (!AudioSys.ok('fanfare', 1)) return;
    const notes = win ? [262, 330, 392, 523, 659] : [220, 207, 196, 174, 147];
    notes.forEach((f, i) => { AudioSys.tone('sawtooth', f, f, 0.5, 0.06, i * 0.18); AudioSys.tone('sine', f / 2, f / 2, 0.6, 0.08, i * 0.18); });
  }
};

// ---------------------------------------------------------------- voice: ElevenLabs Warlord + synth fallback
const LINES = {
  start: 'Legion of Ash, to war! Dig deep and hold the line.',
  lowGold: 'Gold reserves low—train more Diggers!',
  defend: 'Form the shield wall!',
  colossus: 'Unleash the Colossus!',
  crumble: 'Their Monolith crumbles—press the attack!',
  possess: 'Take command yourself!',
  charge: 'Charge! Break their lines!',
  retreat: 'Fall back to the Spire!',
  spireHit: 'The Spire is under siege—hold them back!',
  reinforce: 'Enemy reinforcements! Steel yourselves!',
  victory: 'The Crimson Monolith falls. The crown is ours!',
  defeat: 'The Spire has fallen... we will rise from the ash.'
};
const Voice = {
  VOICE_IDS: ['2EiwWnXFnvU5JabPnv8n', 'pNInz6obpgDQGcFmaJgB'], // gravelly war veteran, deep fallback
  voiceIdx: 0,
  MODEL: 'eleven_turbo_v2_5',
  mode: 'synth', key: store.get('sc_el_key', ''), cache: new Map(),
  speaking: false, text: '', textT: 0, pending: null, cool: {}, gap: 0, fails: 0, status: '', statusT: 0,
  source: null, synthNodes: null, synthVoice: null,
  analyser() { return this.mode === 'eleven' && this.source ? AudioSys.analyser : AudioSys.synthAnalyser; },
  say(id, cooldown = 10, priority = 1) {
    const now = G.realT;
    if (this.cool[id] && now < this.cool[id]) return;
    this.cool[id] = now + cooldown;
    if (this.speaking || this.gap > 0) {
      if (!this.pending || priority >= this.pending.priority) this.pending = { id, priority };
      return;
    }
    this.play(id);
  },
  play(id) {
    const text = LINES[id]; if (!text) return;
    this.text = text; this.textT = 0; this.speaking = true; const line = this.line = (this.line || 0) + 1;
    if (AudioSys.muted || !AudioSys.ctx) { this.fakeSpeak(text, false, true); return; }
    if (this.mode === 'eleven' && this.key) {
      this.fetchLine(text).then(entry => {
        if (this.line !== line) return;
        if (AudioSys.muted) { this.done(); return; }
        const s = AudioSys.ctx.createBufferSource(); s.buffer = entry.buf; s.playbackRate.value = 0.96;
        s.connect(AudioSys.voiceIn); this.source = s;
        s.onended = () => { if (this.source === s) { this.source = null; this.done(); } };
        s.start();
      }).catch(err => {
        if (this.line !== line) return;
        this.fails++;
        const msg = String(err && err.message || err);
        this.flash('VOICE LINK ERROR: ' + msg.slice(0, 40));
        if (this.fails >= 2 || /401|403/.test(msg)) { this.mode = 'synth'; this.flash('ELEVENLABS UNAVAILABLE — SYNTH VOICE ACTIVE'); }
        this.synthSpeak(text);
      });
    } else this.synthSpeak(text);
  },
  // in-memory cache: text → Promise<{blob, buf}> so repeated lines never re-hit the API
  fetchLine(text) {
    if (this.cache.has(text)) return this.cache.get(text);
    const p = (async () => {
      let r;
      for (;;) {
        r = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + this.VOICE_IDS[this.voiceIdx] + '?output_format=mp3_44100_128', {
          method: 'POST',
          headers: { 'xi-api-key': this.key, 'Content-Type': 'application/json', 'Accept': 'audio/mpeg' },
          body: JSON.stringify({ text, model_id: this.MODEL, voice_settings: { stability: 0.32, similarity_boost: 0.85, style: 0.6, use_speaker_boost: true } })
        });
        // voice unavailable on this account → try the next voice
        if ((r.status === 404 || r.status === 400) && this.voiceIdx < this.VOICE_IDS.length - 1) { this.voiceIdx++; continue; }
        break;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const blob = await r.blob();
      const buf = await AudioSys.ctx.decodeAudioData(await blob.arrayBuffer());
      return { blob, buf };
    })();
    this.cache.set(text, p);
    p.catch(() => this.cache.delete(text));
    return p;
  },
  pickVoice() {
    if (this.synthVoice || !window.speechSynthesis) return this.synthVoice;
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    this.synthVoice = vs.find(v => /daniel|george|fred|male|arthur|guy|ryan|brian/i.test(v.name)) || vs[0] || null;
    return this.synthVoice;
  },
  synthSpeak(text) {
    const hasTTS = !!(window.speechSynthesis && window.SpeechSynthesisUtterance) && speechSynthesis.getVoices().length > 0;
    if (hasTTS) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const v = this.pickVoice(); if (v) u.voice = v;
        u.pitch = 0.35; u.rate = 0.9; u.volume = 1;
        let ended = false; const line = this.line; const end = () => { if (!ended) { ended = true; if (this.line === line) this.done(); } };
        u.onend = end; u.onerror = end;
        setTimeout(end, 1500 + text.length * 90);
        speechSynthesis.speak(u);
        this.fakeSpeak(text, false, false);
        return;
      } catch (e) { /* fall through to the growl */ }
    }
    this.fakeSpeak(text, true, true);
  },
  // drives the visualiser (and, without speechSynthesis, an audible rune-growl babble)
  fakeSpeak(text, audible, autoEnd) {
    const dur = 0.9 + text.length * 0.058;
    if (AudioSys.ctx) {
      const c = AudioSys.ctx, t0 = c.currentTime;
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 78;
      const o2 = c.createOscillator(); o2.type = 'square'; o2.frequency.value = 117;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 2.2;
      const g = c.createGain(); g.gain.value = 0;
      o.connect(bp); o2.connect(bp); bp.connect(g); g.connect(AudioSys.synthAnalyser);
      if (audible && !AudioSys.muted) { const out = c.createGain(); out.gain.value = 0.35; g.connect(out); out.connect(AudioSys.sfx); }
      let t = t0 + 0.05;
      while (t < t0 + dur - 0.1) {
        const syl = rand(0.09, 0.2);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(rand(0.35, 0.9), t + syl * 0.3);
        g.gain.linearRampToValueAtTime(0.0001, t + syl);
        o.frequency.setValueAtTime(rand(66, 95), t); bp.frequency.setValueAtTime(rand(420, 1100), t);
        t += syl + (Math.random() < 0.18 ? rand(0.08, 0.2) : 0.01);
      }
      o.start(t0); o2.start(t0); o.stop(t0 + dur); o2.stop(t0 + dur);
    }
    const line = this.line;
    if (autoEnd) setTimeout(() => { if (this.line === line) this.done(); }, dur * 1000);
  },
  done() { if (!this.speaking) return; this.speaking = false; this.gap = 0.9; },
  flash(msg) { this.status = msg; this.statusT = 4; },
  update(dt) {
    if (this.speaking || this.textT < 4) this.textT += dt;
    if (this.statusT > 0) this.statusT -= dt;
    if (!this.speaking && this.gap > 0) { this.gap -= dt; if (this.gap <= 0 && this.pending) { const p = this.pending; this.pending = null; this.play(p.id); } }
  },
  stopAll() {
    this.pending = null; this.line = (this.line || 0) + 1;
    if (this.source) { try { this.source.stop(); } catch (e) { /* already stopped */ } this.source = null; }
    if (window.speechSynthesis) speechSynthesis.cancel();
    this.speaking = false; this.gap = 0;
  }
};
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { Voice.synthVoice = null; };

// ---------------------------------------------------------------- canvas & view
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 1, GY = 0, VW = 0, HS = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  HS = clamp(Math.min(W / 1280, H / 680), 0.5, 1.4);
  GY = H - 60 * HS;
  SC = Math.min((GY - 118 * HS) / 470, W / 820);
  SC = Math.max(SC, 0.3);
  VW = W / SC;
}
window.addEventListener('resize', resize);
resize();
const cam = { x: 0, tx: 0, shake: 0, sdx: 0, sdy: 0, sx: 0, sy: 0 };
function addShake(mag, dx = 0, dy = 1) { cam.shake = Math.min(26, cam.shake + mag); const l = Math.hypot(dx, dy) || 1; cam.sdx = dx / l; cam.sdy = dy / l; }
const toWorld = (sx, sy) => ({ x: cam.x + sx / SC, y: (sy - GY) / SC + CFG.GROUND });

    }
    const dmg = dmgOf(u) * (bash ? 0.7 : 1) * (u.type === 'digger' ? 1 : 1);
    hurt(e, dmg, u, { kx: f * 160, ky: -120 });

    if (u.type === 'vanguard' && (e.type === 'vanguard')) { sparks((u.x + e.x) / 2, u.j.hF.y, 5); SFX.clash(e.x); }

function updateCorpses(dt) {

    c.acc += dt;

        const vx = (p.x - p.px) * 0.985, vy = (p.y - p.py) * 0.985;
        p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + CFG.GRAV * 0.7 * h * h;
        if (p.y > CFG.GROUND - 1.5) { p.y = CFG.GROUND - 1.5; p.px = p.x - vx * 0.55; p.py = p.y + vy * 0.15; }
      }
      for (let it = 0; it < 4; it++) {
        for (let k = 0; k < JC.length; k++) {
          const a = c.pts[JC[k][0]], b = c.pts[JC[k][1]];

}

// ---------------------------------------------------------------- world update
let tipIdx = 0;
function updateWorld(dt) {
  G.time += dt;
  // ending: collapse animation, losers turn to ash
  if (G.ending) {
    G.ending.t += dt;
    const loser = G.ending.win ? 1 : 0;
    G.mon[loser].collapse = Math.min(1, G.ending.t / 2.4);
    if (Math.random() < 0.6) {
      const mx = CFG.HOME[loser];
      spawnP({ type: 'rock', x: mx + rand(-50, 50), y: CFG.GROUND - rand(80, 380) * (1 - G.mon[loser].collapse), vx: rand(-200, 200), vy: rand(-300, 0), grav: 1300, life: rand(0.8, 1.4), size: rand(3, 7), col: loser ? '#4c1a20' : '#231d2b', rot: 0, vr: rand(-8, 8) });
      dust(mx + rand(-60, 60), CFG.GROUND, 2, 1.6);
    }
    if (G.ending.t < 2.4 && Math.random() < 0.2) addShake(3, 0, 1);
    for (const e of G.side[loser]) { if (e.alive && e.dieAt !== undefined && G.ending.t > e.dieAt) { e.inv = 0; hurt(e, 99999, null, { kx: rand(-120, 120), ky: -200, force: true, silent: true }); } }
    if (G.ending.t > 3.6) {
      G.state = G.ending.win ? (G.stage >= STAGES.length ? 'complete' : 'victory') : 'defeat';
    }
  }
  // per-side lists + mount slots + front line
  for (let s = 0; s < 2; s++) {
    G.side[s] = G.units.filter(u => u.alive && u.side === s);
    let idx = 0;
    const dir = s ? -1 : 1, home = CFG.HOME[s];
    let front = home;
    for (const u of G.side[s]) {
      if (u.type === 'deadeye') { u.mountIdx = idx < 4 ? idx : -1; idx++; }
      if (u.type === 'vanguard' || u.type === 'colossus') { if ((u.x - front) * dir > 0) front = u.x; }
    }
    G.front[s] = front === home ? CFG.HOME[1 - s] : front;
  }
  // passive income + training
  if (!G.ending) {
    G.gold[0] += CFG.TRICKLE * dt;
    G.gold[1] += CFG.TRICKLE * dt * (1 + 0.3 * (G.stage - 1));
    for (let s = 0; s < 2; s++) {
      for (const t of ORDER) {
        const Q = G.queue[s][t];
        if (Q.q <= 0) { Q.t = 0; continue; }
        Q.t += dt;
        if (Q.t >= UNIT[t].train) {
          Q.t = 0; Q.q--;

  }

  for (let s = 0; s < 2; s++) {
    const arr = G.side[s];
    for (let a = 0; a < arr.length; a++) {
      const A = arr[a]; if (!A.alive || A.mounted || A.climbing || A === G.possessed) continue;
      for (let b = a + 1; b < arr.length; b++) {
        const B = arr[b]; if (!B.alive || B.mounted || B.climbing || B === G.possessed) continue;
        const dx = B.x - A.x, min = 7 * (A.s + B.s) * 0.5;

          const push = (min - Math.abs(dx)) * 0.5 * Math.min(1, dt * 6) * (dx >= 0 ? 1 : -1);
          A.x -= push; B.x += push;
        }
      }
    }
  }
  G.units = G.units.filter(u => u.alive);
  updateArrows(dt);
  updateCorpses(dt);
  updateParts(dt);
  for (const m of G.mon) { m.flash -= dt; m.hitT = Math.max(0, m.hitT - dt); }
  // smoke from damaged monuments
  for (let s = 0; s < 2; s++) {
    const m = G.mon[s];
    if (m.hp / m.max < 0.45 && Math.random() < dt * 8) spawnP({ type: 'smoke', x: CFG.HOME[s] + rand(-30, 30), y: CFG.GROUND - rand(150, 330), vx: rand(-10, 10) + 14, vy: rand(-40, -20), life: rand(2, 3.4), size: rand(10, 18), col: '#1c1820' });
  }
  // commander observations
  if (!G.ending) {
    G.lowGoldT -= dt;
    if (G.lowGoldT <= 0) {
      G.lowGoldT = 2;
      const c = counts(0);
      if (G.gold[0] < 150 && c.digger < 4) Voice.say('lowGold', 35, 1);
    }
  }
}

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // embers
  if (boot.embers.length < 90 && Math.random() < 0.6) boot.embers.push({ x: rand(0, W), y: H + 10, vx: rand(-15, 15), vy: rand(-90, -30), life: rand(3, 7), s: rand(1, 2.6) });
  for (let i = boot.embers.length - 1; i >= 0; i--) {
    const e = boot.embers[i]; e.life -= dt; e.x += (e.vx + Math.sin(G.realT * 2 + i) * 12) * dt; e.y += e.vy * dt;

    ctx.fillStyle = `rgba(255,${140 + (i * 7) % 80},50,${Math.min(1, e.life / 2)})`; ctx.fillRect(e.x, e.y, e.s, e.s);

  text('— LEGION OF ASH —', W / 2, H * 0.16 + 50 * s, 18 * s, '#d9a25e', 'center');

  const ft = (G.realT * 0.9) % 1;
  drawUnitIcon('vanguard', W / 2 - 330 * s, H * 0.16 + 50 * s, 78 * s, 0, ft);
  drawUnitIcon('vanguard', W / 2 + 330 * s, H * 0.16 + 50 * s, 78 * s, 1, (ft + 0.5) % 1);

  const pw = Math.min(W - 30, 620 * s), ph = 330 * s, px = (W - pw) / 2, py = H * 0.32;
  stonePanel(px, py, pw, ph, 0.3);
  text('WAR COUNCIL LINK', W / 2, py + 28 * s, 20 * s, '#ffd77a', 'center', 900);
  wrap('Bind an ElevenLabs API key to give your Warlord a gravelly voice (model eleven_turbo_v2_5). Every line is cached in memory, so repeats cost no extra credits.', W / 2, py + 56 * s, pw - 50 * s, 11.5 * s, '#c9b99f', 16 * s);
  // key field
  const fx = px + 30 * s, fy = py + 100 * s, fw = pw - 60 * s, fh = 46 * s;

  ctx.fillStyle = '#070508'; rr(fx, fy, fw, fh, 5 * s); ctx.fill();
  ctx.strokeStyle = fhv ? 'rgba(255,200,110,0.95)' : 'rgba(255,170,80,0.5)'; ctx.lineWidth = 1.6; ctx.stroke();

  button('PASTE KEY', fx, by, bw, bh, pasteButton, { size: 12 * s });
  button('FORGE LINK & PLAY', fx + bw + 12 * s, by, bw, bh, linkAndPlay, { size: 12 * s, enabled: !!boot.key, active: !!boot.key });
  button('CLEAR KEY', fx + (bw + 12 * s) * 2, by, bw, bh, clearKey, { size: 12 * s, enabled: !!boot.key });
  button('PLAY OFFLINE / SYNTH AUDIO', W / 2 - 170 * s, by + bh + 16 * s, 340 * s, 46 * s, playOffline, { size: 14 * s, active: !boot.key });
  text('Your key stays in this browser (localStorage) and is only ever sent to api.elevenlabs.io.', W / 2, py + ph - 16 * s, 9.5 * s, '#857865', 'center', 500);
  if (boot.msgT > 0) { boot.msgT -= dt; ctx.globalAlpha = clamp(boot.msgT, 0, 1); text(boot.msg, W / 2, fy - 12 * s, 11 * s, '#ff9a6a', 'center', 900); ctx.globalAlpha = 1; }
  // controls
  const cy = py + ph + 26 * s;
  const lines = ['1-4 TRAIN  ·  Z GARRISON  ·  X DEFEND  ·  C CHARGE  ·  U ARMORY  ·  P PAUSE  ·  M MUTE', 'CLICK A WARRIOR TO POSSESS IT  ·  A/D MOVE  ·  W/SPACE JUMP  ·  CLICK STRIKE / HOLD TO DRAW  ·  R RELEASE'];
  lines.forEach((l, i) => fitText(l, W / 2, cy + i * 20 * s, 11 * s, '#bfae94', W - 30));
  if (G.best) text('FURTHEST CONQUEST: STAGE ' + romans(G.best), W / 2, cy + 48 * s, 10 * s, '#d9a25e', 'center');
}

// ---------------------------------------------------------------- camera + main loop
function updateCamera(dt) {
  if (G.state === 'play' && !G.paused && !G.armory) {
    if (G.possessed) cam.tx = G.possessed.x - VW / 2 + G.possessed.f * VW * 0.12;
    else {
      const pan = 950 / Math.max(0.6, SC) * dt;
      if (keys.KeyA || keys.ArrowLeft) cam.tx -= pan;
      if (keys.KeyD || keys.ArrowRight) cam.tx += pan;
      const dragging = [...ptrs.values()].some(p => p.kind === 'pan' && p.dragging);
      if (mouse.type === 'mouse' && mouse.inside && !dragging && mouse.y > 100 * HS && mouse.y < H - 30 * HS) {
        const edge = 26;
        if (mouse.x < edge) cam.tx -= pan * (1 - mouse.x / edge);
        else if (mouse.x > W - edge) cam.tx += pan * (1 - (W - mouse.x) / edge);
      }
    }
  }
  const maxX = CFG.WORLD_W - VW;
  if (maxX <= 0) { cam.tx = maxX / 2; } else cam.tx = clamp(cam.tx, 0, maxX);
  cam.x = lerp(cam.x, cam.tx, 1 - Math.exp(-dt * 8));
  if (Math.abs(cam.x - cam.tx) < 0.05) cam.x = cam.tx;
  // directional shake
  cam.shake *= Math.exp(-dt * 7);
  if (cam.shake < 0.05) cam.shake = 0;
  const t = G.realT * 55;
  cam.sx = (cam.sdx * Math.sin(t) * 0.8 + Math.sin(t * 1.7) * 0.25) * cam.shake * HS;
  cam.sy = (cam.sdy * Math.cos(t * 1.1) * 0.8 + Math.sin(t * 2.3) * 0.2) * cam.shake * HS;
}
function update(dt) {
  G.realT += dt;
  Voice.update(dt);
  if (G.msgT > 0) G.msgT -= dt;
  if (G.state === 'play') {
    if (G.banner > 0) G.banner -= dt;
    if (!G.paused && !G.armory) {
      let wdt = dt;
      if (G.hitStop > 0) { G.hitStop -= dt; wdt *= 0.12; }
      updateWorld(wdt);
    }
  } else if (G.state === 'victory' || G.state === 'defeat' || G.state === 'complete') {
    updateCorpses(dt); updateParts(dt);
  }
  updateCamera(dt);
}
function render(dt) {
  if (G.state === 'boot') { drawBoot(dt); return; }
  drawSky();
  drawParallax();
  drawGround();
  drawSpire();
  drawMonolith();
  drawMonHPWorld();
  drawWorldEntities();
  drawForeground();
  // ambient ash
  screenTransform();
  for (const a of ambient) {
    a.y -= a.v * dt / H * 0.6; a.x += Math.sin(G.realT + a.w) * dt * 0.01;
    if (a.y < 0) { a.y = 1; a.x = Math.random(); }
    const px = ((a.x * W - cam.x * SC * 0.2) % W + W) % W;
    ctx.fillStyle = `rgba(255,${120 + (a.w * 30 | 0)},60,${0.35 + 0.3 * Math.sin(G.realT * 3 + a.w)})`;
    ctx.fillRect(px, a.y * H, a.s, a.s);
  }
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.45, W / 2, H * 0.55, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawHUD();
  if (G.armory || G.paused || G.state !== 'play') UI.btns = [];
  if (G.armory) drawArmory();
  else if (G.state === 'victory' || G.state === 'defeat' || G.state === 'complete') drawEndScreen();
  else if (G.paused) drawPause();
}
let last = performance.now();
