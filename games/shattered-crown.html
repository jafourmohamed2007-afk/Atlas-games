// ---------------------------------------------------------------- ragdolls & particles
const JN = ['head', 'neck', 'hip', 'eF', 'hF', 'eB', 'hB', 'kF', 'fF', 'kB', 'fB'];

function makeCorpse(u, kx, ky) {

    const p = u.j[n]; const hf = clamp((u.y - p.y) / (60 * s), 0, 1.2);
    const vx = kx * (0.5 + hf * 0.8) + rand(-30, 30), vy = ky * (0.6 + hf * 0.5) + rand(-40, 20);
    return { x: p.x, y: p.y, px: p.x - vx * dt, py: p.y - vy * dt };
  });

  G.corpses.push({ pts, rest, side: u.side, type: u.type, s, life: 5.5, f: u.f, acc: 0, z: isZ(u) });

function updateCorpses(dt) {

    c.life -= dt; if (c.life <= 0) { G.corpses.splice(i, 1); continue; }
    c.acc += dt;
    const h = 1 / 60;
    while (c.acc >= h) {
      c.acc -= h;

        const vx = (p.x - p.px) * 0.985, vy = (p.y - p.py) * 0.985;
        p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + CFG.GRAV * 0.7 * h * h;
        if (p.y > CFG.GROUND - 1.5) { p.y = CFG.GROUND - 1.5; p.px = p.x - vx * 0.55; p.py = p.y + vy * 0.15; }
      }
      for (let it = 0; it < 4; it++) {
        for (let k = 0; k < JC.length; k++) {
          const a = c.pts[JC[k][0]], b = c.pts[JC[k][1]];
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001;
          const diff = (d - c.rest[k]) / d * (k === 10 ? 0.15 : 0.5);

    const loser = G.ending.win ? 1 : 0;
    G.mon[loser].collapse = Math.min(1, G.ending.t / 2.4);
    if (Math.random() < 0.6) {
      const mx = CFG.HOME[loser];
      spawnP({ type: 'rock', x: mx + rand(-50, 50), y: CFG.GROUND - rand(80, 300) * (1 - G.mon[loser].collapse), vx: rand(-200, 200), vy: rand(-300, 0), grav: 1300, life: rand(0.8, 1.4), size: rand(3, 7), col: loser ? '#4c1a20' : '#231d2b', rot: 0, vr: rand(-8, 8) });

  }

    G.side[s] = G.units.filter(u => u.alive && u.side === s);
    const dir = s ? -1 : 1, home = CFG.HOME[s];
    let front = home;
    const load = [0, 0];
    for (const u of G.side[s]) {
      if (u.inside) continue;
      if (u.type === 'digger' && u.vein >= 0 && u.task !== 'toBase') load[u.vein]++;
      if (u.type === 'vanguard' || u.type === 'phalanx' || BIG[u.type]) { if ((u.x - front) * dir > 0) front = u.x; }
    }
    G.veinLoad[s] = load;
    G.front[s] = front === home ? CFG.HOME[1 - s] : front;
  }

  for (let s = 0; s < 2; s++) if (G.stance[s] !== 'garrison') for (const u of G.side[s]) if (u.inside) { u.inside = false; u.x = CFG.HOME[s] + (s ? -1 : 1) * rand(14, 34); u.atkCd = rand(0, 0.5); }

    G.gold[0] += CFG.TRICKLE * dt;

      G.gold[1] += CFG.TRICKLE * dt * (1 + 0.3 * (G.level - 1));

    }
    for (let s = 0; s < 2; s++) {
      for (const t of ORDER) {
        const Q = G.queue[s][t];
        if (Q.q <= 0) { Q.t = 0; continue; }
        Q.t += dt;
        if (Q.t >= UNIT[t].train) {
          Q.t = 0; Q.q--;
          const dir = s ? -1 : 1;

  else if (e.code === 'ArrowRight') G.diff = (G.diff + 1) % DIFFS.length;

function startMode(m) { AudioSys.unlock(); SFX.ui(); if (m === 'campaign') newCampaign(); else if (m === 'endless') newEndless(); else newSkirmish(); }
function toTitle() { G.paused = false; G.armory = false; G.state = 'title'; Voice.stopAll(); }
function endPrimary() {

// ---------------------------------------------------------------- armory

    if (up.icon === 'spire') stanceIcon('spire', ix, iy - 4 * s, 30 * s, '#d8b77a');
    else if (up.icon === 'wall') stanceIcon('garrison', ix, iy - 4 * s, 30 * s, '#d8b77a');
    else drawUnitIcon(up.icon, ix, iy + 26 * s, 56 * s, 0, hv ? (G.realT * 1.2) % 1 : 0);
    const tx = cx + 84 * s, tw = cw - 94 * s;
    text(up.name.toUpperCase(), tx, cy + 18 * s, 11.5 * s, '#ffe3a6', 'left', 900);
    wrap(up.desc, tx, cy + 36 * s, tw, 9.5 * s, '#bfb19a', 13 * s, 'left');
    for (let k = 0; k < UPG_MAX; k++) {
      const dx = tx + 6 * s + k * 15 * s, dy = cy + ch - 46 * s;
      ctx.fillStyle = k < lvl ? '#f2b544' : 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.moveTo(dx, dy - 5 * s); ctx.lineTo(dx + 5 * s, dy); ctx.lineTo(dx, dy + 5 * s); ctx.lineTo(dx - 5 * s, dy); ctx.closePath(); ctx.fill();
    }
    button(maxed ? 'MASTERED' : 'FORGE · ' + cost, tx, cy + ch - 34 * s, tw, 26 * s, () => buyUpgrade(up), { enabled: afford, size: 10 * s });
    text(String(i + 1), cx + 7 * s, cy + 10 * s, 10 * s, 'rgba(255,230,180,0.55)', 'left', 900);
  });
  const bl = G.armoryMode === 'stage' ? 'MARCH TO STAGE ' + romans(G.stage + 1) + '  ▶' : 'RETURN TO BATTLE';
  button(bl, W / 2 - 130 * s, py + ph - 56 * s, 260 * s, 40 * s, closeArmory, { size: 14 * s, active: true });
  if (G.armoryMode === 'stage') text('Unspent war chest joins your starting gold.', W / 2, py + ph - 8 * s, 9.5 * s, '#9c8f7c', 'center', 500);
}
function drawEndScreen() {
  dim(0.62);
  const s = HS, st = G.state, E = endless();
  const win = st !== 'defeat';
  const title = E ? 'THE DEAD TAKE THE SPIRE' : st === 'complete' ? 'THE CROWN IS MADE WHOLE' : win ? 'VICTORY' : 'THE SPIRE HAS FALLEN';
  titleText(title, H * 0.28, (E || st === 'complete' ? 36 : 54) * s);
  const sub = E ? (G.wave.record ? 'A new record! The legion held for ' + G.wave.survived + ' waves.' : 'The legion held for ' + G.wave.survived + ' waves.')
    : st === 'complete' ? 'All five monoliths lie in ash. The Legion endures.'
    : G.mode === 'skirmish' ? (win ? 'The Crimson Legion is broken.' : 'The Crimson Legion holds the field.')
    : win ? 'The Crimson Monolith of ' + STAGES[G.stage - 1] + ' is rubble.' : 'The Legion scatters into the ash of ' + STAGES[G.stage - 1] + '.';
  text(sub, W / 2, H * 0.28 + 44 * s, 14 * s, E && G.wave.record ? '#c8ff7a' : '#e8d9bd', 'center', 500);
  const stats = E ? [['WAVES SURVIVED', G.wave.survived], ['BEST', G.bestWave], ['DEAD SLAIN', G.stats.kills], ['TIME', fmtTime(G.time)]]
    : [['FOES SLAIN', G.stats.kills], ['WARRIORS LOST', G.stats.lost], ['HEADSHOTS', G.stats.headshots], ['TIME', fmtTime(G.time)]];
  stats.forEach(([k, v], i) => {
    const x = W / 2 + (i - 1.5) * 140 * s;
    text(String(v), x, H * 0.45, 24 * s, '#ffd77a', 'center', 900);
    text(k, x, H * 0.45 + 24 * s, 9.5 * s, '#9c8f7c', 'center');
  });
  const bx1 = W / 2 - 270 * s, bx2 = W / 2 + 20 * s, by = H * 0.6, bw = 250 * s, bh = 46 * s;
  if (st === 'victory' && G.mode === 'campaign') {
    drawCoin(W / 2 - 80 * s, H * 0.54, 9 * s);
    text('WAR CHEST: ' + G.chest, W / 2 - 66 * s, H * 0.54 + 1, 14 * s, '#ffd35a', 'left', 900);
    button('ENTER THE ARMORY  ▶', W / 2 - 130 * s, by, 260 * s, bh, () => openArmory('stage'), { size: 14 * s, active: true });
  } else if (st === 'complete') {
    button('NEW CAMPAIGN', bx1, by, bw, bh, newCampaign, { size: 14 * s, active: true });
    button('TITLE SCREEN', bx2, by, bw, bh, toTitle, { size: 14 * s });
  } else {
    const primary = E ? 'RISE AGAIN' : G.mode === 'skirmish' && win ? 'BATTLE AGAIN' : 'RETRY';
    button(primary, bx1, by, bw, bh, endPrimary, { size: 14 * s, active: true });
    button('TITLE SCREEN', bx2, by, bw, bh, toTitle, { size: 14 * s });

}
function fmtTime(t) { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function drawPause() {
  dim(0.55);
  titleText('PAUSED', H * 0.4, 46 * HS);
  button('RESUME', W / 2 - 100 * HS, H * 0.5, 200 * HS, 44 * HS, () => { G.paused = false; }, { active: true, size: 14 * HS });
  button('TITLE SCREEN', W / 2 - 100 * HS, H * 0.5 + 56 * HS, 200 * HS, 40 * HS, toTitle, { size: 12 * HS });
}

// ---------------------------------------------------------------- title screen
const bootStones = (() => { const r = rng(42), a = []; for (let y = 0; y < 24; y++) { let x = -r() * 60; while (x < 3000) { const w = 50 + r() * 70; a.push({ x, y: y * 46, w, h: 44, t: r() }); x += w + 3; } } return a; })();
function drawTitle(dt) {
  screenTransform(); UI.btns = [];
  ctx.fillStyle = '#0a070b'; ctx.fillRect(0, 0, W, H);
  for (const b of bootStones) {
    if (b.y > H || b.x > W) continue;
    const l = 14 + b.t * 10 | 0;
    ctx.fillStyle = `rgb(${l + 6},${l},${l + 4})`; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.025)'; ctx.fillRect(b.x, b.y, b.w, 3);
  }
  const eg = ctx.createRadialGradient(W / 2, H * 1.1, 10, W / 2, H * 1.1, Math.max(W, H) * 0.9);
  eg.addColorStop(0, 'rgba(255,110,30,0.55)'); eg.addColorStop(0.5, 'rgba(160,40,20,0.2)'); eg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (boot.embers.length < 90 && Math.random() < 0.6) boot.embers.push({ x: rand(0, W), y: H + 10, vx: rand(-15, 15), vy: rand(-90, -30), life: rand(3, 7), s: rand(1, 2.6) });
  for (let i = boot.embers.length - 1; i >= 0; i--) {
    const e = boot.embers[i]; e.life -= dt; e.x += (e.vx + Math.sin(G.realT * 2 + i) * 12) * dt; e.y += e.vy * dt;
    if (e.life <= 0 || e.y < -10) { boot.embers.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(255,${140 + (i * 7) % 80},50,${Math.min(1, e.life / 2)})`; ctx.fillRect(e.x, e.y, e.s, e.s);
  }
  const s = clamp(Math.min(W / 1000, H / 700), 0.5, 1.4);
  titleText('SHATTERED CROWN', H * 0.13, 60 * s);
  text('— LEGION OF ASH —', W / 2, H * 0.13 + 46 * s, 17 * s, '#d9a25e', 'center');
  // three mode cards
  const cw = Math.min(270 * s, (W - 60) / 3), chh = 300 * s, gap = Math.min(24 * s, (W - cw * 3) / 4);
  const x0 = W / 2 - (cw * 3 + gap * 2) / 2, cy = H * 0.27;
  const ft = (G.realT * 0.9) % 1;
  const cards = [
    { id: 'campaign', title: 'CAMPAIGN', icon: ['vanguard', 0], desc: 'Five battles across the Ashlands against the Crimson Legion. Upgrades carry over between stages.', btn: 'NEW CAMPAIGN', foot: G.best ? 'Furthest: Stage ' + romans(G.best) : 'Start at The Ashen Ford', col: '#ffd77a' },
    { id: 'endless', title: 'ENDLESS DEAD', icon: ['shambler', 1], desc: 'Night falls and the dead rise in endless waves. Hold the Spire for as long as you can.', btn: 'SURVIVE', foot: 'Best: ' + (G.bestWave ? G.bestWave + ' waves' : 'no record yet'), col: '#c8ff7a' },
    { id: 'skirmish', title: 'SKIRMISH', icon: ['colossus', 1], desc: 'A single battle against the Crimson Legion at the difficulty you choose.', btn: 'BATTLE', foot: '', col: '#ff9a7a' }
  ];
  cards.forEach((cd, i) => {
    const x = x0 + i * (cw + gap), hv = isHover(x, cy, cw, chh);
    stonePanel(x, cy, cw, chh, hv ? 0.7 : 0.15);
    ctx.save(); rr(x, cy, cw, chh, 5 * HS); ctx.clip();
    const ig = ctx.createLinearGradient(0, cy, 0, cy + 120 * s);
    ig.addColorStop(0, cd.id === 'endless' ? '#22383a' : '#5a2c2a'); ig.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ig; ctx.fillRect(x, cy, cw, 120 * s);
    drawUnitIcon(cd.icon[0], x + cw / 2, cy + 108 * s, cd.icon[0] === 'colossus' ? 96 * s : 82 * s, cd.icon[1], hv ? ft : 0);
    ctx.restore();
    text(cd.title, x + cw / 2, cy + 132 * s, 19 * s, cd.col, 'center', 900);
    wrap(cd.desc, x + cw / 2, cy + 158 * s, cw - 30 * s, 10.5 * s, '#c9b99f', 15 * s);
    if (cd.id === 'skirmish') {
      button('◀', x + 16 * s, cy + chh - 96 * s, 30 * s, 28 * s, () => { G.diff = (G.diff + DIFFS.length - 1) % DIFFS.length; SFX.ui(); }, { size: 12 * s });
      text(DIFFS[G.diff].name.toUpperCase(), x + cw / 2, cy + chh - 82 * s, 13 * s, '#ffe3a6', 'center', 900);
      button('▶', x + cw - 46 * s, cy + chh - 96 * s, 30 * s, 28 * s, () => { G.diff = (G.diff + 1) % DIFFS.length; SFX.ui(); }, { size: 12 * s });
    }
    button(cd.btn + '  ▶', x + 16 * s, cy + chh - 58 * s, cw - 32 * s, 40 * s, () => startMode(cd.id), { size: 13 * s, active: hv });
    if (cd.foot) text(cd.foot, x + cw / 2, cy + chh - 82 * s, 10 * s, '#9c8f7c', 'center');
    text(String(i + 1), x + 9 * s, cy + 12 * s, 11 * s, 'rgba(255,230,180,0.5)', 'left', 900);
  });
  const ly = cy + chh + 26 * s;
  const lines = ['1-6 TRAIN  ·  Z GARRISON  ·  X DEFEND  ·  C CHARGE  ·  U ARMORY  ·  P PAUSE  ·  M MUTE', 'CLICK A WARRIOR TO POSSESS IT  ·  A/D MOVE  ·  W/SPACE JUMP  ·  CLICK STRIKE / HOLD TO DRAW  ·  R RELEASE'];
  lines.forEach((l, i) => fitText(l, W / 2, ly + i * 19 * s, 10.5 * s, '#bfae94', W - 30));
  text(typeof SC_AUDIO === 'undefined' ? 'Synth audio' : 'Warlord voice & battle sounds by ElevenLabs', W / 2, ly + 44 * s, 9.5 * s, '#6f6458', 'center', 500);
}

// ---------------------------------------------------------------- camera + main loop
function updateCamera(dt) {
  if (G.state === 'play' && !G.paused && !G.armory) {
    if (G.possessed) cam.tx = G.possessed.x - VW / 2 + G.possessed.f * VW * 0.12;
    else {
      const pan = 950 / Math.max(0.6, SC) * dt;
      if (keys.KeyA || keys.ArrowLeft) cam.tx -= pan;
      if (keys.KeyD || keys.ArrowRight) cam.tx += pan;
      const dragging = [...ptrs.values()].some(p => p.kind === 'pan' && p.dragging);
      if (mouse.type === 'mouse' && mouse.inside && !dragging && mouse.y > 100 * HS && mouse.y < H - 30 * HS) {
        const edge = 26;
        if (mouse.x < edge) cam.tx -= pan * (1 - mouse.x / edge);
        else if (mouse.x > W - edge) cam.tx += pan * (1 - (W - mouse.x) / edge);
      }
    }
  }
  const maxX = CFG.WORLD_W - VW;
  cam.tx = maxX <= 0 ? maxX / 2 : clamp(cam.tx, 0, maxX);
  cam.x = lerp(cam.x, cam.tx, 1 - Math.exp(-dt * 8));
  if (Math.abs(cam.x - cam.tx) < 0.05) cam.x = cam.tx;
  cam.shake *= Math.exp(-dt * 7);
  if (cam.shake < 0.05) cam.shake = 0;
  const t = G.realT * 55;
  cam.sx = (cam.sdx * Math.sin(t) * 0.8 + Math.sin(t * 1.7) * 0.25) * cam.shake * HS;
  cam.sy = (cam.sdy * Math.cos(t * 1.1) * 0.8 + Math.sin(t * 2.3) * 0.2) * cam.shake * HS;
}
function update(dt) {
  G.realT += dt;
  Voice.update(dt);
  if (G.msgT > 0) G.msgT -= dt;
  if (G.state === 'play') {
    if (G.banner > 0) G.banner -= dt;
    if (!G.paused && !G.armory) {
      let wdt = dt;
      if (G.hitStop > 0) { G.hitStop -= dt; wdt *= 0.12; }
      updateWorld(wdt);
    }
  } else if (G.state === 'victory' || G.state === 'defeat' || G.state === 'complete') {
    updateCorpses(dt); updateParts(dt);
  }
  updateCamera(dt);
}
function render(dt) {
  if (G.state === 'title') { drawTitle(dt); return; }
  drawSky();
  drawParallax();
  drawGround();
  drawSpire();
  if (!endless()) drawMonolith();
  drawMonHPWorld();
  drawWorldEntities();
  drawForeground();
  screenTransform();
  const P = pal();
  for (const a of ambient) {
    a.y -= a.v * dt / H * 0.6; a.x += Math.sin(G.realT + a.w) * dt * 0.01;
    if (a.y < 0) { a.y = 1; a.x = Math.random(); }
    const px = ((a.x * W - cam.x * SC * 0.2) % W + W) % W;
    ctx.fillStyle = `rgba(${P.ember[0]},${P.ember[1] - (a.w * 20 | 0)},${P.ember[2]},${0.3 + 0.3 * Math.sin(G.realT * 3 + a.w)})`;
    ctx.fillRect(px, a.y * H, a.s, a.s);
  }
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.45, W / 2, H * 0.55, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, endless() ? 'rgba(0,5,10,0.55)' : 'rgba(0,0,0,0.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawHUD();
  if (G.armory || G.paused || G.state !== 'play') UI.btns = [];
  if (G.armory) drawArmory();
  else if (G.state === 'victory' || G.state === 'defeat' || G.state === 'complete') drawEndScreen();
  else if (G.paused) drawPause();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  try { update(dt); render(dt); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
resetQueues();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Cinzel').catch(() => {});
window.__SC = { G, CFG, UNIT, train, setStance, possess, release, startBattle, startMode, newCampaign, newEndless, newSkirmish, AudioSys, Voice, input, cam, step: (dt) => updateWorld(dt) };
})();
