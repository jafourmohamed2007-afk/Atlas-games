// ---------------------------------------------------------------- projectiles
function aimAt(u, t) {

  const d = Math.abs(tx - sx);

  u.aimTx = tx; u.aimTy = ty; u.aimMon = -1;
  const T = clamp(d / 640, 0.42, 1.35);
  u.shotT = T;
  const vx = (tx - sx) / T, vy = (ty - sy - 0.5 * CFG.ARROW_G * T * T) / T;
  const a = Math.atan2(vy, vx);

}
function aimAtMon(u, ms) {

}
function fireAt(u) {

  const vx = (u.aimTx - sx) / T, vy = (u.aimTy - sy - 0.5 * CFG.ARROW_G * T * T) / T;

}
function spawnArrow(u, x, y, vx, vy, dmg) {

  SFX.bow(u.x);
}
function updateArrows(dt) {
  const steps = 3, h = dt / steps;
  for (let i = G.arrows.length - 1; i >= 0; i--) {

    let dead = false;
    for (let s = 0; s < steps && !dead; s++) {
      a.vy += CFG.ARROW_G * h; a.x += a.vx * h; a.y += a.vy * h;
      a.ang = Math.atan2(a.vy, a.vx);
      // units
      for (const e of G.side[1 - a.side]) {
        if (!e.alive) continue;
        if (Math.abs(e.x - a.x) > 30 * e.s || a.y < e.j.head.y - 12 * e.s || a.y > e.y + 4) continue;
        const j = e.j, s2 = e.s;
        const head = Math.hypot(a.x - j.head.x, a.y - j.head.y) < L.head * s2 + 2.2;
        const body = head || distSeg(a.x, a.y, j.neck.x, j.neck.y, j.hip.x, j.hip.y) < 5 * s2 + 2 ||
          distSeg(a.x, a.y, j.hip.x, j.hip.y, j.fF.x, j.fF.y) < 4 * s2 + 1.5 || distSeg(a.x, a.y, j.hip.x, j.hip.y, j.fB.x, j.fB.y) < 4 * s2 + 1.5;
        if (!body) continue;
        if (e.inv > 0) continue;

          sparks(a.x, a.y, 6); SFX.clash(a.x);
          spawnP({ type: 'arrowBit', x: a.x, y: a.y, vx: -a.vx * 0.2, vy: -180, grav: 900, life: 0.8, rot: a.ang, vr: rand(-15, 15), size: 1 });

// ---------------------------------------------------------------- ragdolls & particles
const JN = ['head', 'neck', 'hip', 'eF', 'hF', 'eB', 'hB', 'kF', 'fF', 'kB', 'fB'];

function makeCorpse(u, kx, ky) {
  const dt = 1 / 60, s = u.s;
  const pts = JN.map(n => {
    const p = u.j[n]; const hf = clamp((u.y - p.y) / (60 * s), 0, 1.2);
    const vx = kx * (0.5 + hf * 0.8) + rand(-30, 30), vy = ky * (0.6 + hf * 0.5) + rand(-40, 20);
    return { x: p.x, y: p.y, px: p.x - vx * dt, py: p.y - vy * dt };
  });
  const rest = JC.map(([a, b]) => Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y));
  G.corpses.push({ pts, rest, side: u.side, type: u.type, s, life: 5.5, f: u.f, acc: 0, wang: u.wang, stuck: u.stuck.slice(0, 3) });
  if (G.corpses.length > 46) G.corpses.shift();
}
function updateCorpses(dt) {
  for (let i = G.corpses.length - 1; i >= 0; i--) {
    const c = G.corpses[i];
    c.life -= dt; if (c.life <= 0) { G.corpses.splice(i, 1); continue; }
    c.acc += dt;
    const h = 1 / 60;
    while (c.acc >= h) {
      c.acc -= h;
      for (const p of c.pts) {
        const vx = (p.x - p.px) * 0.985, vy = (p.y - p.py) * 0.985;
        p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + CFG.GRAV * 0.7 * h * h;
        if (p.y > CFG.GROUND - 1.5) { p.y = CFG.GROUND - 1.5; p.px = p.x - vx * 0.55; p.py = p.y + vy * 0.15; }
      }
      for (let it = 0; it < 4; it++) {
        for (let k = 0; k < JC.length; k++) {
          const a = c.pts[JC[k][0]], b = c.pts[JC[k][1]];
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001;
          const stiff = k === 10 ? 0.15 : 0.5;
          const diff = (d - c.rest[k]) / d * stiff;

        }

}
function spawnP(o) {

}

}

// ---------------------------------------------------------------- enemy AI commander
function armyPower(side) {
  let p = 0;
  for (const u of G.side[side]) { if (u.type === 'digger') continue; p += ({ vanguard: 1, deadeye: 1.25, colossus: 5.5 })[u.type] * (0.4 + 0.6 * u.hp / u.maxHp); }
  return p;
}
function counts(side) {
  const c = { digger: 0, vanguard: 0, deadeye: 0, colossus: 0 };
  for (const u of G.side[side]) c[u.type]++;

}
function updateAI(dt) {
  const A = G.ai;

  A.t = Math.max(0.45, 1.35 - G.stage * 0.16);
  const mine = counts(1), foe = counts(0), gold = G.gold[1];
  const wantDig = Math.min(4 + Math.floor(G.stage / 2) + (G.time > 150 ? 1 : 0), 8);
  let choice = null;
  const busy = ORDER.reduce((n, t) => n + G.queue[1][t].q, 0);
  if (busy < 2) {
    if (mine.digger < wantDig && (mine.digger < 2 || Math.random() < 0.7)) choice = 'digger';
    else {
      const wantCol = G.stage >= 2 && mine.colossus < 1 + Math.floor(G.stage / 2) &&
        (foe.vanguard >= 4 || foe.colossus > 0 || G.time > 100);
      if (wantCol && (gold >= 900 || (A.saving && gold < 900))) {
        if (gold >= 900) { choice = 'colossus'; A.saving = false; } else { A.saving = Math.random() < 0.85; }
      }
      if (!choice && !A.saving) {
        const ratio = mine.deadeye / Math.max(1, mine.vanguard);
        if (foe.deadeye > mine.vanguard * 0.8) choice = 'vanguard';
        else if (foe.colossus > 0 && ratio < 0.9) choice = 'deadeye';
        else choice = ratio < 0.55 ? 'deadeye' : 'vanguard';
      }
      if (A.saving && Math.random() < 0.15) A.saving = false;
    }
    if (choice) train(1, choice);
  }
  // stance with hysteresis
  if (A.stanceT <= 0) {
    const my = armyPower(1), their = armyPower(0);
    const threat = G.side[0].some(u => u.type !== 'digger' && u.x > CFG.HOME[1] - 650);
    let st = G.stance[1];
    const aggro = 1.05 - G.stage * 0.04;
    if (my < 2.5 && their > 3 && !threat) st = 'garrison';
    else if (my >= Math.max(4.5, their * (1.15 * aggro + 0.1)) || (G.time > 200 && my > their * 0.95 && my >= 4)) st = 'charge';

    if (threat && st === 'garrison') st = 'defend';
    if (st !== G.stance[1]) { G.stance[1] = st; A.stanceT = 6; }
  }
}

// ---------------------------------------------------------------- world update
let tipIdx = 0;
function updateWorld(dt) {

    G.mon[loser].collapse = Math.min(1, G.ending.t / 2.4);
    if (Math.random() < 0.6) {
      const mx = CFG.HOME[loser];
      spawnP({ type: 'rock', x: mx + rand(-50, 50), y: CFG.GROUND - rand(80, 380) * (1 - G.mon[loser].collapse), vx: rand(-200, 200), vy: rand(-300, 0), grav: 1300, life: rand(0.8, 1.4), size: rand(3, 7), col: loser ? '#4c1a20' : '#231d2b', rot: 0, vr: rand(-8, 8) });
      dust(mx + rand(-60, 60), CFG.GROUND, 2, 1.6);
    }
    if (G.ending.t < 2.4 && Math.random() < 0.2) addShake(3, 0, 1);
    for (const e of G.side[loser]) { if (e.alive && e.dieAt !== undefined && G.ending.t > e.dieAt) { e.inv = 0; hurt(e, 99999, null, { kx: rand(-120, 120), ky: -200, force: true, silent: true }); } }

  }

  for (let s = 0; s < 2; s++) {

    let idx = 0;
    const dir = s ? -1 : 1, home = CFG.HOME[s];
    let front = home;
    for (const u of G.side[s]) {
      if (u.type === 'deadeye') { u.mountIdx = idx < 4 ? idx : -1; idx++; }
      if (u.type === 'vanguard' || u.type === 'colossus') { if ((u.x - front) * dir > 0) front = u.x; }
    }
    G.front[s] = front === home ? CFG.HOME[1 - s] : front;
  }
  // passive income + training
  if (!G.ending) {
    G.gold[0] += CFG.TRICKLE * dt;
    G.gold[1] += CFG.TRICKLE * dt * (1 + 0.3 * (G.stage - 1));
    for (let s = 0; s < 2; s++) {
      for (const t of ORDER) {
        const Q = G.queue[s][t];
        if (Q.q <= 0) { Q.t = 0; continue; }
        Q.t += dt;
        if (Q.t >= UNIT[t].train) {
          Q.t = 0; Q.q--;
          const dir = s ? -1 : 1;
          const u = makeUnit(s, t, CFG.HOME[s] + dir * rand(10, 30));
          addUnit(u); G.side[s].push(u);
          if (!s) SFX.spawn();
          dust(u.x, CFG.GROUND, 4, 0.6 * u.s);
        }
      }
    }
    updateAI(dt);
  }
  for (const u of G.units) if (u.alive) updateUnit(u, dt);
  // light separation so allies don't stack in one pixel
  for (let s = 0; s < 2; s++) {
    const arr = G.side[s];
    for (let a = 0; a < arr.length; a++) {
      const A = arr[a]; if (!A.alive || A.mounted || A.climbing || A === G.possessed) continue;
      for (let b = a + 1; b < arr.length; b++) {
        const B = arr[b]; if (!B.alive || B.mounted || B.climbing || B === G.possessed) continue;
        const dx = B.x - A.x, min = 7 * (A.s + B.s) * 0.5;
        if (Math.abs(dx) < min && A.mv === 0 && B.mv === 0) {
          const push = (min - Math.abs(dx)) * 0.5 * Math.min(1, dt * 6) * (dx >= 0 ? 1 : -1);
          A.x -= push; B.x += push;
        }
      }
    }
  }
  G.units = G.units.filter(u => u.alive);
  updateArrows(dt);
  updateCorpses(dt);
  updateParts(dt);
  for (const m of G.mon) { m.flash -= dt; m.hitT = Math.max(0, m.hitT - dt); }
  // smoke from damaged monuments
  for (let s = 0; s < 2; s++) {
    const m = G.mon[s];
    if (m.hp / m.max < 0.45 && Math.random() < dt * 8) spawnP({ type: 'smoke', x: CFG.HOME[s] + rand(-30, 30), y: CFG.GROUND - rand(150, 330), vx: rand(-10, 10) + 14, vy: rand(-40, -20), life: rand(2, 3.4), size: rand(10, 18), col: '#1c1820' });
  }
  // commander observations
  if (!G.ending) {
    G.lowGoldT -= dt;
    if (G.lowGoldT <= 0) {
      G.lowGoldT = 2;
      const c = counts(0);
      if (G.gold[0] < 150 && c.digger < 4) Voice.say('lowGold', 35, 1);
    }
  }
}

// ---------------------------------------------------------------- input
const keys = {};

const UI = { btns: [] };

  return null;
}
function unitAt(sx, sy) {

  for (const u of G.side[0]) {
    if (!u.alive) continue;
    const hx = 14 * u.s + 6 / SC, top = u.y - 64 * u.s - 6, bot = u.y + 6;
    if (Math.abs(w.x - u.x) < hx && w.y > top && w.y < bot) { const d = Math.abs(w.x - u.x); if (d < bd) { bd = d; best = u; } }

}
function updateTouchHold() {

}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.focus();

  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.type = e.pointerType; mouse.inside = true;
  const p = { id: e.pointerId, sx: e.clientX, sy: e.clientY, kind: 'none', camStart: cam.tx, dragging: false };
  ptrs.set(e.pointerId, p);

cv.addEventListener('pointermove', e => {

});

window.addEventListener('keydown', e => {
  if (e.repeat && !['Backspace'].includes(e.key)) { keys[e.code] = true; if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); return; }
  keys[e.code] = true;
  AudioSys.unlock();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (G.state === 'boot') { bootKey(e); return; }
  if (e.code === 'KeyM') { AudioSys.setMuted(!AudioSys.muted); return; }
  if (G.state === 'victory' || G.state === 'complete' || G.state === 'defeat') {
    if (e.code === 'Enter' || e.code === 'Space') { if (G.state === 'victory') openArmory('stage'); else if (G.state === 'complete') newCampaign(); else startStage(G.stage, G.carry); }
    return;

});

// ---------------------------------------------------------------- title screen
const boot = { embers: [] };
function bootKey(e) { if (e.key === 'Enter' || e.code === 'Space') startGame(); }
function startGame() { AudioSys.unlock(); newCampaign(); }
store.del('sc_el_key'); // clean up keys saved by older builds
function newCampaign() { G.upg = { dig: 0, blade: 0, range: 0, spire: 0 }; G.chest = 0; startStage(1, 0); }

// ---------------------------------------------------------------- armory
function openArmory(mode) {
  G.armory = true; G.armoryMode = mode; SFX.ui();

}
function closeArmory() {
  SFX.ui();

}
function armoryGold() { return G.armoryMode === 'stage' ? G.chest : G.gold[0]; }
function buyUpgrade(up) {
  const lvl = G.upg[up.id];

  const c = upgCost(up, lvl);
  if (armoryGold() < c) { SFX.deny(); return; }

  G.upg[up.id]++;
  if (up.id === 'spire') { const m = G.mon[0]; const nm = 3000 * (1 + 0.2 * G.upg.spire); m.hp += nm - m.max; m.max = nm; }
  SFX.clink(); SFX.slam(cam.x + VW / 2);
}

  for (let i = 0; i < 34; i++) trees.push({ x: i * 140 + r() * 120, h: 60 + r() * 80, seed: r() * 1000, lean: r() * 0.4 - 0.2 });

// ---------------------------------------------------------------- camera + main loop
function updateCamera(dt) {
  if (G.state === 'play' && !G.paused && !G.armory) {
    if (G.possessed) cam.tx = G.possessed.x - VW / 2 + G.possessed.f * VW * 0.12;
    else {
      const pan = 950 / Math.max(0.6, SC) * dt;
      if (keys.KeyA || keys.ArrowLeft) cam.tx -= pan;
      if (keys.KeyD || keys.ArrowRight) cam.tx += pan;
      const dragging = [...ptrs.values()].some(p => p.kind === 'pan' && p.dragging);
      if (mouse.type === 'mouse' && mouse.inside && !dragging && mouse.y > 100 * HS && mouse.y < H - 30 * HS) {
        const edge = 26;
        if (mouse.x < edge) cam.tx -= pan * (1 - mouse.x / edge);
        else if (mouse.x > W - edge) cam.tx += pan * (1 - (W - mouse.x) / edge);
      }
    }
  }
  const maxX = CFG.WORLD_W - VW;
  if (maxX <= 0) { cam.tx = maxX / 2; } else cam.tx = clamp(cam.tx, 0, maxX);
  cam.x = lerp(cam.x, cam.tx, 1 - Math.exp(-dt * 8));
  if (Math.abs(cam.x - cam.tx) < 0.05) cam.x = cam.tx;
  // directional shake
  cam.shake *= Math.exp(-dt * 7);
  if (cam.shake < 0.05) cam.shake = 0;
  const t = G.realT * 55;
  cam.sx = (cam.sdx * Math.sin(t) * 0.8 + Math.sin(t * 1.7) * 0.25) * cam.shake * HS;
  cam.sy = (cam.sdy * Math.cos(t * 1.1) * 0.8 + Math.sin(t * 2.3) * 0.2) * cam.shake * HS;
}
function update(dt) {
  G.realT += dt;
  Voice.update(dt);
  if (G.msgT > 0) G.msgT -= dt;
  if (G.state === 'play') {
    if (G.banner > 0) G.banner -= dt;
    if (!G.paused && !G.armory) {
      let wdt = dt;
      if (G.hitStop > 0) { G.hitStop -= dt; wdt *= 0.12; }
      updateWorld(wdt);
    }
  } else if (G.state === 'victory' || G.state === 'defeat' || G.state === 'complete') {
    updateCorpses(dt); updateParts(dt);
  }
  updateCamera(dt);
}
