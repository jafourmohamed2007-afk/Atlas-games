// ---------- procedural ground: cached 128px chunks ----------
const CHUNK = 128, chunkCache = new Map();
function biomeAt(wx, wy) {
  const v = fbm(wx / 420, wy / 420, 3);
  const ruin = vnoise(wx / 260, wy / 260, 11);
  return { v, ruin };
}
function getChunk(cx, cy) {
  const key = cx + ',' + cy; let c = chunkCache.get(key);
  if (c) return c;
  c = mk(CHUNK, CHUNK); const x = c.getContext('2d'), id = x.createImageData(CHUNK, CHUNK), d = id.data;
  const ox = cx * CHUNK, oy = cy * CHUNK;
  const GR = [18, 18, 17, 19, 18, 17], AS = [4, 3, 4, 5, 3, 4], DI = [28, 28, 3, 29, 28], ST = [5, 4, 5, 6, 4];
  for (let py = 0; py < CHUNK; py++) for (let px = 0; px < CHUNK; px++) {
    const wx = ox + px, wy = oy + py, h = hash2(wx, wy, 1);
    const v = fbm(wx / 420, wy / 420, 3) + (hash2(wx >> 2, wy >> 2, 5) - 0.5) * 0.06;
    const ruin = vnoise(wx / 260, wy / 260, 11);
    let pi;
    if (ruin > 0.74) { // flagstone ruins
      const row = Math.floor(wy / 12), sx = (wx + (row & 1) * 9) % 18, sy = wy % 12;
      const crack = hash2(Math.floor((wx + (row & 1) * 9) / 18), row, 9);
      if (sx === 0 || sy === 0) pi = 2; else if (crack > 0.8 && h < 0.5) pi = 18; else pi = ST[(h * ST.length) | 0];
      if (crack < 0.12) pi = h < 0.7 ? 3 : 2; // missing slab
    } else if (v < 0.47) pi = GR[(h * GR.length) | 0];
    else if (v < 0.53) pi = h < (v - 0.47) / 0.06 ? DI[(h * 7 * DI.length) % DI.length | 0] : GR[(h * 3 * GR.length) % GR.length | 0];
    else if (v < 0.58) pi = DI[(h * DI.length) | 0];
    else pi = AS[(h * AS.length) | 0];
    if (h > 0.996) pi = 6;
    const rgb = PALRGB[pi], o = (py * CHUNK + px) * 4; d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  // decorations, kept fully inside the chunk
  for (let ty = 0; ty < 8; ty++) for (let tx = 0; tx < 8; tx++) {
    const wx = ox + tx * 16, wy = oy + ty * 16, h = hash2(wx >> 4, wy >> 4, 21);
    const b = biomeAt(wx, wy);
    let s = null;
    if (b.ruin > 0.74) { if (h < 0.05) s = 'd_pillar'; else if (h < 0.08) s = 'd_candle'; else if (h < 0.1) s = 'd_skull'; }
    else if (b.v < 0.47) { if (h < 0.12) s = 'd_tuft'; else if (h < 0.15) s = 'd_grave'; else if (h < 0.165) s = 'd_tree'; else if (h < 0.18) s = 'd_rock'; }
    else { if (h < 0.05) s = 'd_bones'; else if (h < 0.08) s = 'd_skull'; else if (h < 0.1) s = 'd_tree'; else if (h < 0.12) s = 'd_rock'; else if (h < 0.135) s = 'd_grave'; }
    if (!s) continue;
    const sp = SPR[s], dx = tx * 16 + ((hash2(wx, wy, 4) * (16 - Math.min(14, sp.w))) | 0), dy = ty * 16 + 2;
    if (dx + sp.w > CHUNK - 1 || dy + sp.h > CHUNK - 1) continue;
    x.globalAlpha = 0.35; x.fillStyle = C.black; x.fillRect(dx + 1, dy + sp.h - 1, sp.w - 1, 2); x.globalAlpha = 1;
    x.drawImage(hash2(wx, wy, 8) < 0.5 ? sp.fr[0].n : sp.fr[0].f, dx, dy);
  }
  chunkCache.set(key, c);
  if (chunkCache.size > 90) { const first = chunkCache.keys().next().value; chunkCache.delete(first); }
  return c;
}

/* ===== ASHEN VIGIL: Web Audio synth SFX, procedural chiptune, narrator voice ===== */
const AU = {
  ctx: null, master: null, music: null, sfx: null, voice: null, analyser: null, noise: null, last: {}, combo: 0, comboT: 0, live: 0,
  vol: { master: 0.8, music: 0.55, sfx: 0.7 },
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.connect(c.destination);
    this.music = c.createGain(); this.music.connect(this.master);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    // voice bus: dry + short dark echo, then analyser for the rune visualizer
    this.voice = c.createGain(); this.analyser = c.createAnalyser(); this.analyser.fftSize = 256; this.analyser.smoothingTimeConstant = 0.6;
    const dly = c.createDelay(1), fb = c.createGain(), lp = c.createBiquadFilter();
    dly.delayTime.value = 0.19; fb.gain.value = 0.28; lp.type = 'lowpass'; lp.frequency.value = 1400;
    this.voice.connect(this.analyser); this.voice.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); lp.connect(this.analyser);
    this.analyser.connect(this.master);
    const len = c.sampleRate * 1.5, nb = c.createBuffer(1, len, c.sampleRate), ch = nb.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    this.noise = nb;
    this.applyVol();
    VO.decodeAll();
    MUS.start();
  },
  applyVol() {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.vol.master, t, 0.02);
    this.music.gain.setTargetAtTime(this.vol.music * 0.5 * (VO.speaking ? 0.45 : 1), t, 0.08);
    this.sfx.gain.setTargetAtTime(this.vol.sfx * 0.6, t, 0.02);
    this.voice.gain.setTargetAtTime(1.15, t, 0.02);
  },

// ---- procedural chiptune: D minor, layers unlock with intensity (0..5) ----
const MUS = {
  next: 0, step: 0, timer: null, intensity: 0, mode: 'title',
  start() { if (this.timer || !AU.ctx) return; this.next = AU.ctx.currentTime + 0.1; this.timer = setInterval(() => this.tick(), 25); },
  bpm() { return this.mode === 'title' ? 84 : this.mode === 'boss' ? 138 : 104 + this.intensity * 5; },
  tick() {
    const c = AU.ctx; if (!c || c.state !== 'running') return;
    if (this.mode === 'off') { this.next = c.currentTime + 0.05; return; }
    while (this.next < c.currentTime + 0.12) { this.play(this.step, this.next); this.next += 60 / this.bpm() / 4; this.step++; }
  },
  play(step, t) {
    const s = step % 16, bar = Math.floor(step / 16) % 4, I = this.mode === 'boss' ? 5 : this.mode === 'title' ? -1 : this.intensity, d = AU.music;
    const ROOT = [73.42, 58.27, 65.41, 55.0][bar];            // D, Bb, C, A
    const CH = [[293.7, 349.2, 440], [233.1, 293.7, 349.2], [261.6, 329.6, 392], [220, 261.6, 329.6]][bar];
    if (I < 0) { // title: slow drone + sparse bell
      if (s === 0) { AU.tone(ROOT, 1.9, 'triangle', 0.22, 0, d, t, 0.2); AU.tone(ROOT * 1.5, 1.9, 'triangle', 0.08, 0, d, t, 0.3); }
      if (s % 4 === 2 && Math.random() < 0.5) AU.tone(CH[(s / 4 | 0) % 3] * 2, 0.5, 'sine', 0.05, 0, d, t);
      return;
    }
    if ([0, 3, 6, 8, 11, 14].includes(s)) AU.tone(ROOT * (s === 6 || s === 14 ? 2 : 1), 0.18, 'triangle', 0.3, 0, d, t);
    if (I >= 1) AU.tone(CH[s % 3] * (s % 6 < 3 ? 1 : 2), 0.08, 'square', 0.03, 0, d, t);
    if (I >= 2 && (s === 0 || s === 8 || (I >= 3 && (s === 4 || s === 12)))) AU.tone(150, 0.12, 'sine', 0.35, 40, d, t);
    if (I >= 2 && (s === 4 || s === 12)) AU.burst(0.1, 0.14, 1800, 'bandpass', d, t);
    if (I >= 3 && s % 2 === 1) AU.burst(0.03, 0.06, 8000, 'highpass', d, t);
    if (I >= 4) {
      const MEL = [[587, 0, 698, 0, 659, 0, 587, 0, 523, 0, 587, 0, 0, 440, 0, 0], [466, 0, 587, 0, 698, 0, 659, 587, 0, 0, 523, 0, 466, 0, 0, 0],
        [523, 0, 659, 0, 784, 0, 698, 0, 659, 0, 587, 0, 523, 0, 0, 0], [440, 0, 523, 0, 659, 0, 554, 0, 440, 0, 0, 0, 554, 0, 659, 0]][bar];
      if (MEL[s]) AU.tone(MEL[s], 0.2, 'square', 0.035, 0, d, t);
    }
    if (I >= 5 && s % 4 === 0) AU.tone(ROOT * 4, 0.1, 'sawtooth', 0.03, ROOT * 2, d, t);
  }
};

    endless: { t: 'The night returns... and it will never end.', cd: 10 },
    boss: { t: 'Another horror rises from the dark.', cd: 40 }
  },
  buf: {}, failed: {}, last: {}, pending: null, speaking: false, until: 0, src: null, sub: '', subT: 0, subMax: 1, decoded: false, cur: '',
  decodeAll() {
    if (this.decoded || !AU.ctx) return; this.decoded = true;
    for (const k in this.lines) {
      const uri = VOICE_DATA[k];
      if (!uri || uri.indexOf('base64,') < 0) { this.failed[k] = true; continue; }
      try {
        const bin = atob(uri.split('base64,')[1]), arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const ok = (b) => { this.buf[k] = b; }, bad = () => { this.failed[k] = true; };
        const p = AU.ctx.decodeAudioData(arr.buffer, ok, bad);
        if (p && p.catch) p.catch(bad);
      } catch (e) { this.failed[k] = true; }
    }
  },
  // prio: high lines (win/dead/reaper) interrupt; others are dropped while the narrator speaks
  say(k, high) {
    const L = this.lines[k]; if (!L) return false;
    const now = performance.now() / 1000;
    if (this.last[k] && now - this.last[k] < L.cd) return false;
    if (this.speaking && now < this.until && !high) return false;
    // clip still decoding: hold the line briefly instead of falling back to the chime
    if (AU.ctx && !this.buf[k] && !this.failed[k] && VOICE_DATA[k] && !(this.pending && this.pending.k === k && now - this.pending.t > 1.5)) {
      if (!this.pending || this.pending.k !== k) this.pending = { k, high, t: now };
      return false;
    }
    this.pending = null;
    this.last[k] = now;
    if (this.src) { try { this.src.stop(); } catch (e) { } this.src = null; }
    const b = this.buf[k];
    let dur = 2.4;
    if (AU.ctx && b) {
      try {
        const s = AU.ctx.createBufferSource(); s.buffer = b; s.playbackRate.value = 0.93; s.connect(AU.voice); s.start();
        this.src = s; dur = b.duration / 0.93;
        s.onended = () => { if (this.src === s) { this.src = null; } };
      } catch (e) { AU.chime(); }
    } else AU.chime(); // missing or undecodable clip: rune chime + subtitles only
    this.cur = k; this.speaking = true; this.until = now + dur; this.sub = L.t; this.subMax = dur + 0.8; this.subT = this.subMax;
    AU.applyVol();
    return true;
  },
  update(dt) {
    if (this.pending) this.say(this.pending.k, this.pending.high);
    if (this.subT > 0) this.subT -= dt;
    if (this.speaking && performance.now() / 1000 > this.until) { this.speaking = false; AU.applyVol(); }
  },
  stop() { this.pending = null; if (this.src) { try { this.src.stop(); } catch (e) { } } this.src = null; this.speaking = false; this.subT = 0; AU.applyVol(); }
};

}

/* ===== ASHEN VIGIL: endless night, new enemies & bosses, poison hazards, dash, wandering merchant ===== */
const BOSS_NAMES = { golem: 'THE BONE GOLEM', matriarch: 'THE BLOOD MATRIARCH', toadking: 'THE PLAGUE TOAD KING', lich: 'THE LICH', reaper: 'THE PALE REAPER' };

// ---------- bosses & scripted events ----------

  G.bossSeen = true; AU.boom(); G.shake = 5; G.flash = 0.35; G.flashCol = type === 'reaper' ? C.pale : C.blood;
  return e;
}

// ---------- enemy & boss behaviours (each sets e.vx / e.vy) ----------
function dashStep(e, dt, sp, col) { // shared telegraphed charge: returns true while busy
  if (e.dash > 0) { e.dash -= dt; if (e.dash <= 0) { e.vx = 0; e.vy = 0; } burst(e.x, e.y - 8, 2, col, 20, 0.4); return true; }
  if (e.tele > 0) { e.tele -= dt; e.vx = 0; e.vy = 0; if (e.tele <= 0) { e.vx = e.dax * sp; e.vy = e.day * sp; e.dash = 0.5; AU.slash(); } return true; }
  return false;
}
function startDash(e, dx, dy, len) { e.tele = 0.6; e.dax = dx; e.day = dy; addFx('line', { x: e.x, y: e.y, a: Math.atan2(dy, dx), r: len || 130, life: 0.6, col: C.red }); }
function keepRange(e, dx, dy, dist, near, far, sp) {

}

      if (e.t <= 0 && dist < 180) { e.t = rand(2.3, 3.2); fireEnemy('fire', e.x, e.y - 6, dx * 100, dy * 100, e.dmg); }
      break;
    case 'necro':
      keepRange(e, dx, dy, dist, 100, 150, sp); e.t -= dt;
      if (e.t <= 0 && dist < 220 && enemies.list.length < MAX_EN - 20) {
        e.t = rand(4.5, 6); const kind = minutes() > 10 ? 'revenant' : 'husk';

        burst(e.x, e.y - 8, 16, [C.purple, C.violet, C.spirit], 50, 0.6);

    case 'shade':

      if (e.t <= 0 && dist < 170 && dist > 50) { e.t = rand(3.5, 5); e.tele = 0.45; }
      break;
    case 'matriarch': {
      if (dashStep(e, dt, 240, [C.red, C.blood])) break;
      e.phase += dt * 0.8; const tx = P.x + Math.cos(e.phase) * 80, ty = P.y + Math.sin(e.phase) * 60, l = Math.hypot(tx - e.x, ty - e.y) || 1;

        if (r < 0.33) { for (let i = 0; i < 12; i++) { const a = (i / 12) * TAU; spawnEnemy('bat', e.x + Math.cos(a) * 16, e.y + Math.sin(a) * 16); } banner('THE MATRIARCH CALLS HER BROOD'); }
        else if (r < 0.66) { for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU; fireEnemy('shriek', e.x, e.y - 10, Math.cos(a) * 75, Math.sin(a) * 75, e.dmg * 0.5); } AU.zap(); }

          if ((P.x - e.x) ** 2 + (P.y - e.y) ** 2 < R * R) damagePlayer(e.dmg * 1.3, 'toadking');

/* ---- 06-main.js ---- */
/* ===== ASHEN VIGIL: boot, resize, input (keyboard + touch joystick), main loop ===== */
const screenC = document.getElementById('game');
const sctx = screenC.getContext('2d', { alpha: false });
const buf = mk(480, 270);
ctx = buf.getContext('2d');
let DPR = 1;
function resize() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const pw = Math.round(window.innerWidth * DPR), ph = Math.round(window.innerHeight * DPR);
  // integer upscale factor chosen from the smaller side so the buffer stays ~250-300px on that side
  const side = Math.min(pw, ph);
  SC = Math.max(1, Math.round(side / 270)); while (SC > 1 && side / SC < 225) SC--;
  W = Math.ceil(pw / SC); H = Math.ceil(ph / SC);
  buf.width = W; buf.height = H; ctx.imageSmoothingEnabled = false;
  screenC.width = W * SC; screenC.height = H * SC;
  screenC.style.width = (W * SC / DPR) + 'px'; screenC.style.height = (H * SC / DPR) + 'px';
  sctx.imageSmoothingEnabled = false;
  makeVignette();
}
window.addEventListener('resize', resize);

// ---------- keyboard ----------
const KEYS = {};
window.addEventListener('keydown', (e) => {
  AU.init();
  const k = e.code; KEYS[k] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(k)) e.preventDefault();
  UI.touch = false;
  if (G.state === 'shop' && (k === 'Escape' || k === 'KeyP')) { closeShop(); return; }
  if (k === 'KeyP' || k === 'Escape') {
    if (G.state === 'play' || G.state === 'pause') togglePause();
    else if (G.state === 'title' && SCREEN !== 'title') SCREEN = 'title';
    return;
  }
  if (G.state === 'play') { if (k === 'Space' || k === 'ShiftLeft' || k === 'ShiftRight') tryDash(); return; }
  if (G.state === 'levelup' && /^Digit[1-4]$/.test(k)) { UI.pickN = +k.slice(5); return; }
  if (G.state === 'levelup' && k === 'KeyR') { reroll(); return; }
  if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'Tab' || k === 'KeyD' || k === 'KeyS') { if (UI.focus && UI.focus[0] === 's' && UI.focus.length === 2 && (k === 'ArrowRight' || k === 'KeyD')) UI.nudge = 1; else uiNav(1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'KeyA' || k === 'KeyW') { if (UI.focus && UI.focus[0] === 's' && UI.focus.length === 2 && (k === 'ArrowLeft' || k === 'KeyA')) UI.nudge = -1; else uiNav(-1); }
  else if (k === 'Enter' || k === 'Space') { if (UI.focus) UI.keyAct = true; else if (G.state === 'title' && SCREEN === 'title') beginRun(); }
});
window.addEventListener('keyup', (e) => { KEYS[e.code] = false; });
window.addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; JOY.on = false; if (G.state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') togglePause(); });

// ---------- pointer: UI clicks + virtual joystick on the left half ----------
const JOY = { on: false, id: -1, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0 };
const toBuf = (e) => { const r = screenC.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
const pdown = {};
screenC.addEventListener('pointerdown', (e) => {
  AU.init(); e.preventDefault();
  UI.touch = e.pointerType === 'touch';
  const [x, y] = toBuf(e); UI.mx = x; UI.my = y; UI.down = true;
  pdown[e.pointerId] = { x, y, joy: false };
  if (G.state === 'play' && x >= W / 2 && !(y < 46 && x > W - 40)) { tryDash(); pdown[e.pointerId].joy = true; }
  else if (G.state === 'play' && x < W / 2 && !JOY.on && !(x < 82 && y < 40)) {
    Object.assign(JOY, { on: true, id: e.pointerId, bx: x, by: y, kx: x, ky: y, dx: 0, dy: 0 }); pdown[e.pointerId].joy = true;
  }
  try { screenC.setPointerCapture(e.pointerId); } catch (er) { }
});
screenC.addEventListener('pointermove', (e) => {
  const [x, y] = toBuf(e);
  if (JOY.on && e.pointerId === JOY.id) {
    let dx = x - JOY.bx, dy = y - JOY.by; const d = Math.hypot(dx, dy), R = 22;
    if (d > R) { JOY.bx += dx / d * (d - R); JOY.by += dy / d * (d - R); dx = x - JOY.bx; dy = y - JOY.by; } // base follows the finger
    JOY.kx = x; JOY.ky = y; JOY.dx = dx / R; JOY.dy = dy / R;
    return;
  }

});
function pup(e) {

  if (JOY.on && e.pointerId === JOY.id) { JOY.on = false; JOY.dx = JOY.dy = 0; UI.down = Object.keys(pdown).length > 0; return; }
  UI.down = Object.keys(pdown).length > 0;

  const [x, y] = toBuf(e);

screenC.addEventListener('pointerup', pup);
screenC.addEventListener('pointercancel', pup);
screenC.addEventListener('contextmenu', (e) => e.preventDefault());

function readInput() {
  let x = 0, y = 0;
  if (KEYS.KeyA || KEYS.ArrowLeft) x -= 1; if (KEYS.KeyD || KEYS.ArrowRight) x += 1;
  if (KEYS.KeyW || KEYS.ArrowUp) y -= 1; if (KEYS.KeyS || KEYS.ArrowDown) y += 1;
  if (JOY.on) { const d = Math.hypot(JOY.dx, JOY.dy); if (d > 0.18) { x += JOY.dx; y += JOY.dy; } }
  if (window.__avBot) { const v = window.__avBot(); x = v[0]; y = v[1]; } // automated test bots only
  IN.x = x; IN.y = y;
}

// ---------- main loop: rAF + fixed-step simulation ----------
let last = performance.now(), acc = 0, fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  tnow += dt; fpsAcc += dt; fpsN++; if (fpsAcc >= 0.5) { G.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  readInput();
  const spd = DEBUG_SPEED;
  if (G.state === 'play') {
    acc += dt * spd; let n = 0;
    while (acc >= STEP && n < 6 * spd) { update(STEP); acc -= STEP; n++; if (G.state !== 'play') break; }
    if (acc > STEP * 4) acc = 0;
  } else if (G.state === 'dying' || G.state === 'victory') {
    updateParticles(dt * 0.5); G.endT -= dt;
    if (G.endT <= 0) { if (G.state === 'dying') { bankGold(); G.state = 'over'; } else G.state = 'dawn'; }
  } else acc = 0;
  VO.update(dt);
  render(dt);
}
function render(dt) {
  ctx.imageSmoothingEnabled = false;
  uiBegin();
  ctx.fillStyle = C.black; ctx.fillRect(0, 0, W, H);
  if (G.state === 'title') drawTitle(dt);
  else {
    renderWorld(G.state === 'play' || G.state === 'dying' || G.state === 'victory' ? dt : 0);
    if (URLQ.has('art')) { if (URLQ.get('art') === 'logo') { rect(0, 0, W, 64, C.black, 0.55); logo(10, W < 300 ? 3 : 4); } } // key-art capture mode (tools only)
    else if (G.state === 'play') drawHUD();
    else if (G.state === 'pause') { drawHUD(true); drawPause(); }
    else if (G.state === 'levelup') { drawHUD(true); drawLevelUp(); drawVoice(H - 26); }
    else if (G.state === 'chest') { drawHUD(true); drawChest(dt); }
    else if (G.state === 'shop') { drawHUD(true); drawMerchant(); }
    else if (G.state === 'dawn') drawDawn();
    else if (G.state === 'dying' || G.state === 'victory') drawVoice(42);
    else if (G.state === 'over') drawEnd(false);
    else if (G.state === 'win') drawEnd(true);
  }
  if (URLQ.has('fps')) text(G.fps + ' FPS ' + enemies.list.length + ' EN', 3, H - 8, C.lime, 1, 'l', true);
  uiEnd();
  sctx.drawImage(buf, 0, 0, W, H, 0, 0, W * SC, H * SC);
}
const DEBUG_SPEED = Math.max(1, Math.min(8, parseInt(URLQ.get('speed'), 10) || 1));

// ---------- boot ----------
bakeArt();
resize();
requestAnimationFrame(frame);
// debug / test hooks
window.__av = {
  G, P, SAVE, VO, AU, state: () => G.state, start: (h) => { beginRun(); if (h !== undefined) startRun(h); },
  counts: () => ({ enemies: enemies.list.length, gems: gems.list.length, parts: parts.list.length, projs: projs.list.length, fps: G.fps }),
  give: (id, lvl) => { if (WD[id]) { const w = hasW(id); if (w) w.lvl = lvl || 8; else G.weapons.push({ id, lvl: lvl || 1, t: 0, evo: false, ang: 0, rot: 0, pos: [] }); } else if (PD[id]) { const p = hasP(id); if (p) p.lvl = lvl || 1; else G.passives.push({ id, lvl: lvl || 1 }); recalc(); } },
  spawn: (type, n, o) => { for (let i = 0; i < (n || 1); i++) { const [x, y] = ringPos(rand(0, 60)); spawnEnemy(type, x, y, o); } },
  setTime: (s) => { G.time = s; while (EVENTS[G.evi] && EVENTS[G.evi].t <= s - 0.01) G.evi++; },
  chest: () => dropItem('chest', P.x, P.y + 4), xp: (v) => addXP(v), hurt: (d) => damagePlayer(d), smite, ui: UI,
  layout: () => ({ W, H, SC, DPR }), merchant: () => { G.merchantT = 0; }, boss: (t) => spawnBoss(t), endless: enterEndless, dash: tryDash, hazards: () => hazards.list, enemies: () => enemies.list, gems: () => gems.list, items: () => items.list
};

})();
