      } else if (p.kind === 'star') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot + p.life * 4); star(c, p.size * 1.3); c.restore(); }
      else if (p.kind === 'rect') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); c.restore(); }
      else { c.beginPath(); c.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU); c.fill(); }
    }

  }

  /* ---------------- wallet / daily / skins ---------------- */
  function wallet() { var c = store.get('coins', 0); return typeof c === 'number' && isFinite(c) && c >= 0 ? Math.floor(c) : 0; }
  function dailyInfo() {
    var s = store.get('daily', null), t = today();
    if (!s || typeof s.last !== 'string' || !(s.streak >= 1)) return { can: true, day: 1, streak: 0 };
    var diff = dayDiff(s.last, t);
    if (!isFinite(diff)) return { can: true, day: 1, streak: 0 };
    if (diff <= 0) return { can: false, day: s.streak, streak: s.streak };
    if (diff === 1) return { can: true, day: (s.streak % 7) + 1, streak: s.streak % 7 };
    return { can: true, day: 1, streak: 0 };
  }
  function ownedSkins() { var o = store.get('skins', ['grape']); if (!Array.isArray(o)) o = ['grape']; if (o.indexOf('grape') < 0) o.push('grape'); return o; }

  /* ---------------- DOM ---------------- */
  function el(tag, attrs, html) { var e = document.createElement(tag); if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; return e; }

  function soundBtnHTML() { return muted ? ICON.soundOff : ICON.soundOn; }

  function toggleSound() { muted = !muted; store.set('mute', muted); if (!muted) { unlockAudio(); sfx('click'); } refreshSoundBtns(); }

      '<div class="mid"><span class="best" id="hBest"></span><span class="score" id="hScore" aria-live="polite">0</span><span class="info" id="hInfo"></span></div>' +
      '<div class="side"><span class="pill" id="hCoins">' + ICON.coin + '<b>0</b></span><button class="btn icon" id="bSound"></button></div>');
    stage.appendChild(hud);
    app.appendChild(stage);
    /* ===== AD PLACEHOLDER: BANNER 320x50 — paste your banner tag (AdSense / AdinPlay) inside .slot ===== */
    var banner = el('div', { id: 'banner', 'class': EMBED ? 'off' : '' }, '<div class="slot" id="bannerSlot" role="complementary"></div>');
    app.appendChild(banner);
    ctx = canvas.getContext('2d');
    ui.hud = hud; ui.score = $('hScore'); ui.best = $('hBest'); ui.info = $('hInfo'); ui.coins = $('hCoins').querySelector('b');

  }
  var lastScoreShown = -1;
  function updateHud(bump) {

      ui.score.textContent = fmt(K.score); lastScoreShown = K.score;

    }

  }
  function bestScore() { var b = store.get('best:' + cfg.id, 0); return typeof b === 'number' && isFinite(b) ? b : 0; }
  function closeScreens() { var s = stage.querySelectorAll('.screen'); for (var i = 0; i < s.length; i++) s[i].remove(); }
  function screen(id, html, dim) { var old = $(id); if (old) old.remove(); var s = el('div', { 'class': 'screen' + (dim ? ' dim' : ''), id: id }, html); stage.appendChild(s); return s; }

  function showMenu() {
    state = 'menu'; closeScreens(); ui.hud.classList.add('hidden'); Ads.gameplayStop();
    var di = dailyInfo();
    var s = screen('menu',
      '<div class="topbar"><a class="brand" target="_top" href="../' + (K.lang === 'en' ? '' : K.lang + '/') + 'index.html" aria-label="Bubzi">' + (cfg.mascot ? '' : bubziSVG('happy', 34)) + '<span>bubzi</span></a>' +
      '<span class="pill">' + ICON.coin + '<b>' + fmt(wallet()) + '</b></span></div>' +
      bubziSVG('happy').replace('class="mascot-svg"', 'class="mascot"') +
      '<h1 class="title" id="gTitle">' + esc(cfg.title[K.lang] || cfg.title.en) + (K.creator ? ' <small style="font-size:.45em;color:#FFB020">CREATOR</small>' : '') + '</h1>' + /* CREATOR badge */
      '<p class="tag">' + esc(K.t('tagline')) + '</p>' +
      '<button class="btn big" id="bPlay">' + ICON.play + esc(K.t('play')) + '</button>' +
      '<p class="tag">' + esc(K.t('best')) + ': <b>' + fmt(bestScore()) + '</b></p>' +
      '<div class="bottom">' +
      '<button class="btn ghost" id="bDaily">' + ICON.gift + esc(K.t('daily')) + (di.can ? '<span class="dot"></span>' : '') + '</button>' +
      (cfg.noSkins ? '' : '<button class="btn ghost" id="bSkins">' + ICON.shirt + esc(K.t('skins')) + '</button>') +
      '<button class="btn icon" id="bSoundM"></button>' +

    if ($('bSkins')) $('bSkins').onclick = function () { sfx('click'); showSkins(); };
    $('bSoundM').onclick = toggleSound;
    var sel = $('selLang'); sel.value = K.lang;
    sel.onchange = function () { setLang(sel.value); showMenu(); };
    refreshSoundBtns();
    try { $('bPlay').focus({ preventScroll: true }); } catch (e) { }
    return s;
  }
  function showDaily() {
    var di = dailyInfo(), cells = '';
    for (var i = 1; i <= 7; i++) {

      '<div class="col">' + (di.can ? '<button class="btn orange big" id="bClaim">' + ICON.coin + esc(K.t('claim')) + ' +' + DAILY[di.day - 1] + '</button>' : '<p>' + esc(K.t('claimed')) + '</p>') +
      '<button class="btn ghost" id="bBack">' + esc(K.t('back')) + '</button></div></div>', true);
    if ($('bClaim')) $('bClaim').onclick = function () {
      var d = dailyInfo(); if (!d.can) return;
      var amt = DAILY[d.day - 1];
      store.set('coins', wallet() + amt); store.set('daily', { last: today(), streak: d.day });

    };

  }

        '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14C50 14 59 27 59 39C59 52 47 59 32 59C17 59 5 52 5 39C5 27 14 14 32 14Z" fill="' + s.c + '" stroke="' + s.d + '" stroke-width="3"/><circle cx="23" cy="37" r="6" fill="#fff"/><circle cx="41" cy="37" r="6" fill="#fff"/><circle cx="24" cy="38" r="3" fill="#241B4D"/><circle cx="42" cy="38" r="3" fill="#241B4D"/></svg>' +
        '<span>' + esc(s.n[K.lang]) + '</span><span>' + (own ? (s.id === cur ? '✓' : esc(K.t('select'))) : s.p) + '</span></button>';
    });
    screen('skinsScr', '<div class="card"><h2>' + esc(K.t('skins')) + '</h2><span class="pill">' + ICON.coin + '<b>' + fmt(wallet()) + '</b></span><div class="skins">' + html + '</div>' +
      '<button class="btn ghost" id="bBack2" style="width:100%">' + esc(K.t('back')) + '</button></div>', true);
    var btns = stage.querySelectorAll('.skin');
    for (var i = 0; i < btns.length; i++) btns[i].onclick = function () {
      var id = this.getAttribute('data-id'), s = null;
      SKINS.forEach(function (x) { if (x.id === id) s = x; });
      if (!s) return;
      var o = ownedSkins();
      if (o.indexOf(id) >= 0) { store.set('skin', id); sfx('click'); }
      else if (wallet() >= s.p) { store.set('coins', wallet() - s.p); o.push(id); store.set('skins', o); store.set('skin', id); sfx('reward'); confetti(40); toast(K.t('unlocked')); }
      else { sfx('wrong'); toast(K.t('notEnough')); return; }

    };

  }

  function startRound() {
    closeScreens(); parts.length = 0; ptrs = {};
    K.score = 0; K.coinsRound = 0; K.revived = false; K.round++; bonusPaid = 0; lastScoreShown = -1;
    K.tutorial = !store.get('tut:' + cfg.id, false);
    K.info('');
    if (K.creator) creatorApply(); // CREATOR: refill before the round

    ui.hud.classList.remove('hidden');
    updateHud(false);
    state = 'playing'; Ads.gameplayStart();
    var pl = store.get('plays:' + cfg.id, 0); store.set('plays:' + cfg.id, (typeof pl === 'number' ? pl : 0) + 1);
    var rec = store.get('recent', []); if (!Array.isArray(rec)) rec = [];
    rec = rec.filter(function (r) { return r && r.id !== cfg.id; }); rec.unshift({ id: cfg.id, t: Date.now() }); store.set('recent', rec.slice(0, 12));
  }
  function pause() {
    if (state !== 'playing') return;

    if (game.pointerCancel) game.pointerCancel(K);
    screen('pauseScr', '<div class="card"><h2>' + esc(K.t('paused')) + '</h2><div class="col">' +
      '<button class="btn big mint" id="bResume">' + ICON.play + esc(K.t('resume')) + '</button>' +
      '<button class="btn" id="bRestart">' + ICON.redo + esc(K.t('restart')) + '</button>' +
      '<div class="row"><button class="btn ghost" id="bHome">' + ICON.home + esc(K.t('home')) + '</button><button class="btn icon" id="bSoundP"></button></div></div></div>', true);
    $('bResume').onclick = function () { sfx('click'); resume(); };
    $('bRestart').onclick = function () { sfx('click'); startRound(); };
    $('bHome').onclick = function () { sfx('click'); showMenu(); };
    $('bSoundP').onclick = toggleSound; refreshSoundBtns();
    try { $('bResume').focus({ preventScroll: true }); } catch (e) { }
  }
  function resume() { if (state !== 'paused') return; closeScreens(); state = 'playing'; Ads.gameplayStart(); }

  function showOver() {
    state = 'over';
    var rate = cfg.coinRate || 0.02;
    var bonus = Math.max(0, Math.floor(K.score * rate) - bonusPaid); bonusPaid += bonus;
    if (bonus > 0) K.addCoins(bonus);
    var best = bestScore(), isNew = K.score > best && K.score > 0;
    if (isNew) { store.set('best:' + cfg.id, K.score); confetti(90); sfx('star'); }
    var canRevive = overInfo.canRevive !== false && typeof game.revive === 'function' && !K.revived;
    screen('overScr', '<div class="card">' + bubziSVG(isNew ? 'happy' : 'sad', 84) + '<h2>' + esc(overInfo.title || K.t('over')) + '</h2>' +
      (isNew ? '<span class="badge">' + esc(K.t('newBest')) + '</span>' : '') +
      '<div class="row"><div class="stat"><b>' + fmt(K.score) + '</b><span>' + esc(K.t('score')) + '</span></div>' +
      '<div class="stat"><b>' + fmt(Math.max(best, K.score)) + '</b><span>' + esc(K.t('best')) + '</span></div>' +
      '<div class="stat"><b>+' + fmt(K.coinsRound) + '</b><span>' + esc(K.t('earned')) + '</span></div></div>' +
      '<div class="col">' + (canRevive ? '<button class="btn mint" id="bCont">' + ICON.tv + esc(K.t('cont')) + '</button>' : '') +
      '<button class="btn big" id="bAgain">' + ICON.redo + esc(K.t('playAgain')) + '</button>' +
      '<button class="btn ghost" id="bMenu">' + ICON.home + esc(K.t('home')) + '</button></div></div>', true);
    if ($('bCont')) $('bCont').onclick = function () {
      sfx('click');
      Ads.rewarded(function (ok) {
        if (!ok || state !== 'over') return;

      });
    };
    $('bAgain').onclick = function () {
      sfx('click'); roundsSinceAd++;
      if (roundsSinceAd >= 2) { roundsSinceAd = 0; Ads.interstitial(function () { startRound(); }); } else startRound();
    };
    $('bMenu').onclick = function () { sfx('click'); showMenu(); };
    updateHud(false);
    try { $('bAgain').focus({ preventScroll: true }); } catch (e) { }
  }

  /* Placeholder ad overlay — remove once a real ad network is connected */
  function placeholderAd(kind, done) {
    var prev = state; state = 'ad';
    var secs = TEST ? 0.2 : (kind === 'rewarded' ? 5 : 3), left = secs, finished = false;
    var s = el('div', { 'class': 'screen', id: 'ad', role: 'dialog', 'aria-label': K.t('ad') },
      '<div class="adbox"><b>AD PLACEHOLDER</b><span>' + esc(K.t(kind === 'rewarded' ? 'adReward' : 'adInter')) + '</span><div class="count" id="adCount">' + Math.ceil(left) + '</div></div>' +
      (kind === 'rewarded' ? '<button class="btn ghost" id="adSkip">' + esc(K.t('skip')) + '</button>' : ''));
    stage.appendChild(s);
    function finish(ok) {
      if (finished) return; finished = true; clearInterval(iv); if (s.parentNode) s.remove();
      state = prev; done(ok);

      left -= 0.1; var c = $('adCount'); if (c) c.textContent = Math.max(0, Math.ceil(left));
      if (left <= 0) { if (kind === 'rewarded') toast(K.t('reward')); finish(true); }
    }, 100);
    if ($('adSkip')) $('adSkip').onclick = function () { finish(false); };
  }

  /* ---------------- input ---------------- */
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function bindInput() {
    canvas.addEventListener('pointerdown', function (e) {
      unlockAudio();
      if (state !== 'playing') return;
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
      var p = pos(e); ptrs[e.pointerId] = { x0: p.x, y0: p.y, swiped: false };
      if (game.pointerDown) game.pointerDown(p.x, p.y, K, e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (state !== 'playing') return;
      var p = pos(e), pt = ptrs[e.pointerId];
      if (pt && !pt.swiped && game.swipe) {
        var dx = p.x - pt.x0, dy = p.y - pt.y0;
        if (Math.sqrt(dx * dx + dy * dy) > 26) { pt.swiped = true; game.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'), K); }
      }
      if (game.pointerMove) game.pointerMove(p.x, p.y, K, e.pointerId, !!pt);
    });
    function up(e) {
      var had = !!ptrs[e.pointerId]; delete ptrs[e.pointerId];

    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    window.addEventListener('keydown', function (e) {
      unlockAudio();
      if (e.key && e.key.length === 1) { typed = (typed + e.key.toLowerCase()).slice(-CREATOR_CODE.length); if (typed === CREATOR_CODE) { typed = ''; creatorEnter(CREATOR_CODE); } } // CREATOR
      var c = e.code;
      if (state === 'playing') {
        if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); pause(); return; }
        if (GAMEKEYS.indexOf(c) >= 0) e.preventDefault();
        if (game.key) game.key(c, true, K, e.repeat);
      } else if (state === 'paused' && (c === 'Escape' || c === 'KeyP')) { e.preventDefault(); resume(); }
      else if (state === 'menu' && (c === 'Space' || c === 'Enter') && (document.activeElement === document.body || document.activeElement === $('bPlay'))) { e.preventDefault(); sfx('click'); startRound(); }
    });
    window.addEventListener('keyup', function (e) { if (state === 'playing' && game.key) game.key(e.code, false, K, false); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
    window.addEventListener('blur', function () { if (!TEST) pause(); });
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  }
  function resize() {
    var r = stage.getBoundingClientRect();
    var W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height)), nd = Math.min(2.5, window.devicePixelRatio || 1);
    if (W === K.W && H === K.H && nd === dpr && canvas.width) return;
    K.W = W; K.H = H; dpr = nd;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    if (game && game.resize) game.resize(K);
  }

  /* ---------------- loop ---------------- */
  var last = 0;
  function step(dt) {
    K.time += dt; K.dt = dt;
    if (state === 'playing') game.update(dt, K);
    else if (game.idle && (state === 'menu' || state === 'dying')) game.idle(dt, K, state);
    updateParts(dt);
    shakeMag *= Math.pow(0.0015, dt); if (shakeMag < 0.2) shakeMag = 0;
    flashA = Math.max(0, flashA - dt * 2.5);
    if (state === 'dying') { dyingT -= dt; if (dyingT <= 0) showOver(); }
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, K.W, K.H);
    ctx.save();
    if (shakeMag > 0) ctx.translate(rand(-shakeMag, shakeMag), rand(-shakeMag, shakeMag));
    game.draw(ctx, K, state);
    drawParts(ctx);
    ctx.restore();
    if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, K.W, K.H); ctx.globalAlpha = 1; }
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    var raw = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
    for (var i = 0; i < SPEED; i++) step(raw);
    render();
  }

  /* ---------------- boot ---------------- */
  window.BubziKit = {
    run: function (g) {
      game = g; cfg = g;
      var l = Q.get('lang') || store.get('lang', null) || (navigator.language || 'en').slice(0, 2).toLowerCase();
      K.lang = LANGS.indexOf(l) >= 0 ? l : 'en'; K.rtl = K.lang === 'ar';
      var th = cfg.theme || Q.get('theme') || store.get('theme', null); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);
      buildDom(); bindInput(); resize();
      if (game.init) game.init(K);
      if (store.get('creator:' + cfg.id, false)) creatorApply(); // CREATOR
      game.reset(K);
      showMenu();
      if (AUTOSTART) startRound();
      Ads.loadingFinished();
      requestAnimationFrame(frame);
      window.__bubzi = { K: K, game: game, start: startRound, menu: showMenu, pause: pause, resume: resume,
        over: function () { K.gameOver(); }, state: function () { return state; }, parts: function () { return parts.length; } };
    }
  };
})();

</script>
<script>
/* Hill Hopper — original physics hill driving game for Bubzi */
(function () {
  'use strict';
  var WR = 22, AXLE = 92, G = 1300;
  var w1, w2, sc, camX, camY, fuel, maxX, bonus, gas, brake, coins, cans, lastCanX, lastCoinX, airAcc, prevAng, grounded, stillT, wheelRot, tutT, flipsShown, keyGas, keyBrake, crashed;

  function ground(x) {
    if (x < 500) return 520;
    var d = x - 500, amp = Math.min(1, d / 2500), big = Math.min(1.6, 1 + d / 20000);
    return 520 - amp * big * (95 * Math.sin(d * 0.0042) + 50 * Math.sin(d * 0.0105 + 1.3) + 22 * Math.sin(d * 0.024 + 0.4)) + amp * 40;
  }
  function slope(x) { return (ground(x + 1) - ground(x - 1)) / 2; }
  function layout(K) { sc = K.H / 760; }
  function placeCar(x) {
    var a = Math.atan(slope(x));
    w1 = { x: x - Math.cos(a) * AXLE / 2, y: 0, vx: 0, vy: 0, g: false };
    w2 = { x: x + Math.cos(a) * AXLE / 2, y: 0, vx: 0, vy: 0, g: false };
    w1.y = ground(w1.x) - WR - 2; w2.y = ground(w2.x) - WR - 2;
    prevAng = Math.atan2(w2.y - w1.y, w2.x - w1.x); airAcc = 0; stillT = 0; crashed = false;
  }
  function spawnStuff(K, upto) {
    while (lastCoinX < upto) {
      lastCoinX += K.rand(450, 800);
      for (var i = 0; i < 5; i++) { var cx = lastCoinX + i * 46; coins.push({ x: cx, y: ground(cx) - 48 }); }
    }
    while (lastCanX < upto) { lastCanX += K.rand(1700, 2500) + maxX * 0.05; cans.push({ x: lastCanX, y: ground(lastCanX) - 34 }); }
  }
  function wheelStep(w, h, drive) {
    w.vy += G * h; w.x += w.vx * h; w.y += w.vy * h;
    var gy = ground(w.x), s = slope(w.x), len = Math.sqrt(1 + s * s), nx = s / len, ny = -1 / len;
    var d = (gy - w.y) / len;
    w.g = false;
    if (d < WR) {
      var pen = WR - d; w.x += nx * pen; w.y += ny * pen;
      var vn = w.vx * nx + w.vy * ny;
      if (vn < 0) { w.vx -= vn * nx * 1.12; w.vy -= vn * ny * 1.12; }
      w.g = true;
      var tx = -ny, ty = nx, vt = w.vx * tx + w.vy * ty;
      if (drive > 0 && vt < 820) { w.vx += tx * drive * h; w.vy += ty * drive * h; }
      else if (drive < 0 && vt > -380) { w.vx += tx * drive * h; w.vy += ty * drive * h; }
      else if (!drive) { var f = Math.min(1, 0.6 * h); w.vx -= tx * vt * f; w.vy -= ty * vt * f; }
    }
  }
  function carState() {
    var cx = (w1.x + w2.x) / 2, cy = (w1.y + w2.y) / 2, a = Math.atan2(w2.y - w1.y, w2.x - w1.x);
    return { x: cx, y: cy, a: a, ux: Math.sin(a), uy: -Math.cos(a) };
  }

  BubziKit.run({
    id: 'hill-hopper', coinRate: 0.02,
    title: { en: 'Hill Hopper', fr: 'Saute-Collines', ar: 'قافز التلال' },
    strings: {
      en: { tagline: 'Hold GAS to drive, flip in the air for bonus coins!', crash: 'Bonk! Head first!', nofuel: 'Out of fuel!', flip: 'Flip!', fuel: 'Fuel' },
      fr: { tagline: 'Maintiens GAZ pour rouler, fais des saltos pour des pièces bonus !', crash: 'Bonk ! Sur la tête !', nofuel: 'Plus d’essence !', flip: 'Salto !', fuel: 'Essence' },
      ar: { tagline: 'اضغط على البنزين للقيادة ونفّذ الشقلبات لتربح عملات!', crash: 'بونك! على الرأس!', nofuel: 'نفد الوقود!', flip: 'شقلبة!', fuel: 'وقود' }
    },
    init: layout, resize: layout,
    reset: function (K) {
      if (K.test) K.dbg = function () { return { w1: w1, w2: w2, fuel: fuel }; };
      layout(K);
      coins = []; cans = []; lastCanX = 900; lastCoinX = 600; fuel = 100; maxX = 200; bonus = 0; gas = {}; brake = {}; keyGas = false; keyBrake = false;
      wheelRot = 0; tutT = 0; flipsShown = 0;
      placeCar(200); camX = 0; camY = 0;
      spawnStuff(K, 4000);
    },
    revive: function (K) {
      var c = carState(); placeCar(Math.max(200, c.x - 120)); fuel = Math.max(fuel, 60); gas = {}; brake = {};
    },
    pointerDown: function (x, y, K, id) { if (x > K.W / 2) gas[id] = 1; else brake[id] = 1; K.sfx('tick'); },
    pointerUp: function (x, y, K, id) { delete gas[id]; delete brake[id]; },
    pointerCancel: function () { gas = {}; brake = {}; keyGas = false; keyBrake = false; },
    key: function (code, down) {
      if (code === 'ArrowRight' || code === 'KeyD' || code === 'ArrowUp' || code === 'KeyW' || code === 'Space') keyGas = down;
      if (code === 'ArrowLeft' || code === 'KeyA' || code === 'ArrowDown' || code === 'KeyS') keyBrake = down;
    },
    update: function (dt, K) {
      tutT += dt;
      var g = keyGas || Object.keys(gas).length > 0, b = keyBrake || Object.keys(brake).length > 0;
      if (fuel <= 0) g = false;
      var steps = 4, h = dt / steps, drive = g ? 1150 : b ? -900 : 0;
      for (var s = 0; s < steps; s++) {
        wheelStep(w1, h, drive); wheelStep(w2, h, drive);
        // rigid axle constraint
        var dx = w2.x - w1.x, dy = w2.y - w1.y, d = Math.sqrt(dx * dx + dy * dy) || 0.001, nx = dx / d, ny = dy / d, diff = (d - AXLE) / 2;
        w1.x += nx * diff; w1.y += ny * diff; w2.x -= nx * diff; w2.y -= ny * diff;
        var rv = (w2.vx - w1.vx) * nx + (w2.vy - w1.vy) * ny;
        w1.vx += nx * rv / 2; w1.vy += ny * rv / 2; w2.vx -= nx * rv / 2; w2.vy -= ny * rv / 2;
        // air control: gas = lean back, brake = lean forward
        if (!w1.g && !w2.g && (g || b)) {
          var px = -ny, py = nx, k = (g ? 1 : -1) * 520 * h;
          w2.vx -= px * k; w2.vy -= py * k; w1.vx += px * k; w1.vy += py * k;
        }
        // angular damping on ground to stop jitter
        if (w1.g && w2.g) { var avx = (w1.vx + w2.vx) / 2, avy = (w1.vy + w2.vy) / 2; w1.vx += (avx - w1.vx) * 0.02; w1.vy += (avy - w1.vy) * 0.02; w2.vx += (avx - w2.vx) * 0.02; w2.vy += (avy - w2.vy) * 0.02; }
      }
      var c = carState();
      grounded = w1.g || w2.g;
      // flips
      var da = c.a - prevAng; if (da > Math.PI) da -= K.TAU; if (da < -Math.PI) da += K.TAU; prevAng = c.a;
      if (!grounded) airAcc += da;
      else {
        var flips = Math.floor(Math.abs(airAcc) / (K.TAU * 0.85));
        if (flips > 0) {
          bonus += flips * 50; K.addCoins(flips * 3, (c.x - camX) * sc, (c.y - camY) * sc - 40);
          K.floatText(K.W / 2, K.H * 0.35, K.t('flip') + (flips > 1 ? ' x' + flips : ''), '#FFC93C', 40); K.sfx('flip'); K.confetti(30); flipsShown++;
        }
        airAcc = 0;
      }
      // head crash
      var hx = c.x + c.ux * 46, hy = c.y + c.uy * 46;
      if (hy > ground(hx) - 14 && Math.cos(c.a) < 0.3) {
        crashed = true; K.burst((hx - camX) * sc, (hy - camY) * sc, ['#FFFFFF', '#FFC93C', '#FF5FA2'], 24, 300, 6); K.sfx('hit');
        K.gameOver({ title: K.t('crash') }); return;
      }
      // fuel
      fuel -= dt * (g ? 5.5 : 1.8); if (fuel < 0) fuel = 0;
      var speed = Math.hypot((w1.vx + w2.vx) / 2, (w1.vy + w2.vy) / 2);
      if (fuel <= 0 && speed < 20 && grounded) { stillT += dt; if (stillT > 1.2) { K.gameOver({ title: K.t('nofuel') }); return; } } else stillT = 0;
      if (g && grounded && Math.random() < 0.5) K.burst((w1.x - camX) * sc, (w1.y + WR - camY) * sc, ['#C9A27A', '#E8D2B0'], 1, 80, 4);
      // pickups
      for (var i = coins.length - 1; i >= 0; i--) { var cn = coins[i]; if (Math.hypot(cn.x - c.x, cn.y - c.y) < 62) { coins.splice(i, 1); bonus += 2; K.addCoins(1, (cn.x - camX) * sc, (cn.y - camY) * sc); } }
      for (var j = cans.length - 1; j >= 0; j--) { var cc = cans[j]; if (Math.hypot(cc.x - c.x, cc.y - c.y) < 75) { cans.splice(j, 1); fuel = 100; K.sfx('reward'); K.floatText((cc.x - camX) * sc, (cc.y - camY) * sc, K.t('fuel') + ' 100%', '#14C8A0', 26); } }
      coins = coins.filter(function (o) { return o.x > camX - 200; }); cans = cans.filter(function (o) { return o.x > camX - 200; });
      maxX = Math.max(maxX, c.x); spawnStuff(K, camX + K.W / sc + 2500);
      wheelRot += (speed * dt / WR) * (((w1.vx + w2.vx) >= 0) ? 1 : -1);
      // camera
      var vw = K.W / sc, vh = K.H / sc;
      camX += (c.x - vw * 0.32 - camX) * Math.min(1, dt * 5);
      camY += (c.y - vh * 0.55 - camY) * Math.min(1, dt * 3);
      if (g && Math.random() < dt * 12) K.sfx('engine');
      if (c.x > 520) K.tutorialDone();
      K.setScore(Math.floor((maxX - 200) / 50) + bonus);
      K.info(K.t('fuel') + ' ' + Math.ceil(fuel) + '%');
    },
    draw: function (ctx, K, state) {
      var W = K.W, H = K.H, vw = W / sc;
      var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#9BE7FF'); g.addColorStop(1, '#E9FFF5');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // far hills parallax
      ctx.fillStyle = '#A7F0C9';
      ctx.beginPath(); ctx.moveTo(0, H);
      for (var x = 0; x <= W + 20; x += 20) { var wx = x / sc + camX * 0.3; ctx.lineTo(x, H * 0.55 + Math.sin(wx * 0.004) * 40 * sc + Math.sin(wx * 0.011) * 18 * sc); }
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.scale(sc, sc); ctx.translate(-camX, -camY);
      // ground
      var x0 = camX - 40, x1 = camX + vw + 40, bottom = camY + H / sc + 50;
      ctx.fillStyle = '#8B5E3C'; ctx.beginPath(); ctx.moveTo(x0, bottom);
      for (x = x0; x <= x1; x += 14) ctx.lineTo(x, ground(x)); ctx.lineTo(x1, bottom); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#A9744C'; ctx.beginPath(); ctx.moveTo(x0, bottom);
      for (x = x0; x <= x1; x += 14) ctx.lineTo(x, ground(x) + 34); ctx.lineTo(x1, bottom); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#14C8A0'; ctx.lineWidth = 16; ctx.lineJoin = 'round'; ctx.beginPath();
      for (x = x0; x <= x1; x += 14) { if (x === x0) ctx.moveTo(x, ground(x) + 4); else ctx.lineTo(x, ground(x) + 4); } ctx.stroke();
      // distance posts
      ctx.font = K.font(26); ctx.textAlign = 'center'; ctx.fillStyle = '#241B4D';
      for (var m = Math.ceil(x0 / 2500) * 2500; m < x1; m += 2500) { if (m <= 200) continue; var gy = ground(m); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(m - 3, gy - 70, 6, 70); ctx.fillStyle = '#FF5FA2'; K.roundRect(ctx, m - 40, gy - 108, 80, 40, 10); ctx.fill(); ctx.fillStyle = '#FFFFFF'; ctx.fillText(Math.round(m / 50) + 'm', m, gy - 86); }
      // pickups
      coins.forEach(function (c) { K.drawCoin(ctx, c.x, c.y, 16, K.time + c.x * 0.01); });
      cans.forEach(function (c) {
        ctx.save(); ctx.translate(c.x, c.y + Math.sin(K.time * 3 + c.x) * 4);
        ctx.fillStyle = '#E8364F'; K.roundRect(ctx, -20, -26, 40, 52, 8); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.font = K.font(26); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('F', 0, 2);
        ctx.fillStyle = '#B31E35'; ctx.fillRect(-8, -34, 16, 9); ctx.restore();
      });
      // car
      var c = carState();
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a);
      if (!crashed || state === 'playing') {
        K.drawBubzi(ctx, -4, -44, 26, { mood: state === 'dying' || state === 'over' ? 'sad' : (!grounded ? 'wow' : 'happy'), lookX: 0.6 });
      }
      ctx.fillStyle = '#C25400'; K.roundRect(ctx, -66, -30, 132, 38, 16); ctx.fill();
      ctx.fillStyle = '#FF8A1F'; K.roundRect(ctx, -66, -32, 132, 32, 16); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; K.roundRect(ctx, -54, -27, 46, 8, 4); ctx.fill();
      ctx.fillStyle = '#FFC93C'; ctx.beginPath(); ctx.arc(62, -16, 7, 0, K.TAU); ctx.fill();
      ctx.restore();
      [w1, w2].forEach(function (w) {
        ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(wheelRot);
        ctx.fillStyle = '#241B4D'; ctx.beginPath(); ctx.arc(0, 0, WR, 0, K.TAU); ctx.fill();
        ctx.fillStyle = '#C9B8FF'; ctx.beginPath(); ctx.arc(0, 0, WR * 0.5, 0, K.TAU); ctx.fill();
        ctx.fillStyle = '#5A2EE8'; ctx.fillRect(-2.5, -WR * 0.5, 5, WR); ctx.restore();
      });
      ctx.restore();
      // pedals
      var ps = Math.min(92, W * 0.22), py = H - ps - 16;
      var gOn = keyGas || Object.keys(gas).length > 0, bOn = keyBrake || Object.keys(brake).length > 0;
      [[16, bOn, '#5E5689', -1], [W - ps - 16, gOn, '#14C8A0', 1]].forEach(function (pd) {
        ctx.globalAlpha = pd[1] ? 0.95 : 0.7;
        ctx.fillStyle = 'rgba(36,27,77,0.35)'; K.roundRect(ctx, pd[0], py + 6, ps, ps, 22); ctx.fill();
        ctx.fillStyle = pd[2]; K.roundRect(ctx, pd[0], py + (pd[1] ? 5 : 0), ps, ps, 22); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); var cx = pd[0] + ps / 2, cy = py + ps / 2 + (pd[1] ? 5 : 0);
        ctx.moveTo(cx + pd[3] * ps * 0.22, cy); ctx.lineTo(cx - pd[3] * ps * 0.14, cy - ps * 0.22); ctx.lineTo(cx - pd[3] * ps * 0.14, cy + ps * 0.22); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
      });
      if (K.tutorial && state === 'playing' && c.x < 520) { var k = (tutT * 1.3) % 1; K.drawHand(ctx, W - ps / 2 - 16, py + ps * 0.55, k > 0.35, Math.min(W, H) / 190); }
    }
  });
})();
