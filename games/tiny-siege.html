/* Bubzi Kit — shared "Jelly Pop" styles for every game */
:root{
  --bg:#F2EEFF; --panel:#FFFFFF; --ink:#241B4D; --muted:#5E5689; --line:#DCD3FF; --soft:#ECE6FF;
  --violet:#5A2EE8; --violet-d:#3A17B0; --orange:#FF8A1F; --orange-d:#C25400; --mint:#14C8A0; --mint-d:#0A9475;
  --pink:#FF5FA2; --pink-d:#D43D80; --gold:#FFC93C; --shade:rgba(36,27,77,.55);
  --font: ui-rounded, "Baloo 2", "Nunito", "Varela Round", "Arial Rounded MT Bold", "Segoe UI", system-ui, -apple-system, Roboto, Tahoma, sans-serif;

}
:root[data-theme="dark"]{ --bg:#140F2E; --panel:#221A4A; --ink:#F3F0FF; --muted:#B9B2E6; --line:#120C2B; --soft:#2E2560; --shade:rgba(5,3,15,.7); }

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- AD PLACEHOLDER: BANNER (320x50) ---------- */
#banner{flex:0 0 auto;height:62px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#banner .slot{width:320px;max-width:calc(100% - 16px);height:50px;border:2px dashed #9A90C9;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel)}
#banner.off{display:none}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:10px 12px;
  pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.hud .mid{display:flex;flex-direction:column;align-items:center;line-height:1;pointer-events:none;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.hud .best{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.hud .score{font-size:40px;font-weight:800;color:var(--violet)}
.hud .info{margin-top:4px;padding:2px 10px;border-radius:12px;background:var(--panel);font-size:14px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.hud .info:empty{display:none}
.hud .side{display:flex;gap:8px;align-items:center}
.hidden{display:none !important}

/* ---------- Buttons ---------- */
.btn{font-family:inherit;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:800;color:#fff;background:var(--violet);box-shadow:0 5px 0 var(--violet-d);border-radius:22px;min-height:48px;padding:0 20px;font-size:18px;
  transition:transform .08s ease, box-shadow .08s ease, filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 var(--violet-d)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.big{min-height:72px;font-size:28px;padding:0 44px;border-radius:30px;box-shadow:0 7px 0 var(--violet-d)}
.btn.big:active{box-shadow:0 2px 0 var(--violet-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)} .btn.mint:active{box-shadow:0 1px 0 var(--mint-d)}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 var(--orange-d)} .btn.orange:active{box-shadow:0 1px 0 var(--orange-d)}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 var(--pink-d)} .btn.pink:active{box-shadow:0 1px 0 var(--pink-d)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--line)} .btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.icon{width:48px;min-width:48px;padding:0;border-radius:16px;background:var(--panel);color:var(--violet);box-shadow:0 4px 0 var(--line)}
.btn.icon:active{box-shadow:0 1px 0 var(--line)}
.btn svg{flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:16px;background:var(--panel);
  box-shadow:0 4px 0 var(--line);font-weight:800;font-size:16px;color:var(--ink)}
.dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2px solid var(--panel)}
[dir="rtl"] .dot{right:auto;left:-4px}

.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;

.screen.dim{background:var(--shade)}

#menu .bottom{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;width:100%}
.days div{border-radius:12px;background:var(--soft);padding:6px 0;font-size:12px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.days div.done{background:var(--mint);color:#fff}
.days div.today{background:var(--orange);color:#fff;transform:scale(1.08);box-shadow:0 3px 0 var(--orange-d)}

.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.skin{font-family:inherit;border:none;border-radius:16px;background:var(--soft);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;

.skin svg{width:44px;height:44px}
.skin.sel{outline:3px solid var(--mint)}

#ad{background:rgba(10,8,25,.88);z-index:50;color:#fff}

.btn svg{vertical-align:middle}

.pill[hidden]{display:none!important}

      '<div class="col">' + (di.can ? '<button class="btn orange big" id="bClaim">' + bzIcon(24) + esc(K.t('claim')) + ' +' + DAILY[di.day - 1] + '</button>' : '<p>' + esc(K.t('claimed')) + '</p>') +
      '<button class="btn ghost" id="bBack">' + esc(K.t('back')) + '</button></div></div>', true);
    if ($('bClaim')) $('bClaim').onclick = function () {

  function showSkins() {
    var owned = ownedSkins(), cur = skin().id, html = '';

      var own = owned.indexOf(s.id) >= 0;
      html += '<button class="skin' + (s.id === cur ? ' sel' : '') + (own ? '' : ' locked') + '" data-id="' + s.id + '" aria-label="' + esc(s.n[K.lang]) + '">' +
        '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14C50 14 59 27 59 39C59 52 47 59 32 59C17 59 5 52 5 39C5 27 14 14 32 14Z" fill="' + s.c + '" stroke="' + s.d + '" stroke-width="3"/><circle cx="23" cy="37" r="6" fill="#fff"/><circle cx="41" cy="37" r="6" fill="#fff"/><circle cx="24" cy="38" r="3" fill="#241B4D"/><circle cx="42" cy="38" r="3" fill="#241B4D"/></svg>' +
        '<span>' + esc(s.n[K.lang]) + '</span><span>' + (own ? (s.id === cur ? '✓' : esc(K.t('select'))) : s.p) + '</span></button>';
    });

      '<button class="btn ghost" id="bBack2" style="width:100%">' + esc(K.t('back')) + '</button></div>', true);
    var btns = stage.querySelectorAll('.skin');
    for (var i = 0; i < btns.length; i++) btns[i].onclick = function () {

      else { sfx('wrong'); toast(K.t('notEnough')); return; }

  }

  function startRound() {
    closeScreens(); parts.length = 0; ptrs = {};
    K.score = 0; K.coinsRound = 0; K.revived = false; K.round++; bonusPaid = 0; lastScoreShown = -1;
    K.tutorial = !store.get('tut:' + cfg.id, false);
    K.info('');
    if (K.creator) creatorApply(); // CREATOR: refill before the round
    bestAtStart = bestScore(); beatShown = false; K._goal = goalInfo();
    game.reset(K);
    ui.hud.classList.remove('hidden');
    updateHud(false);
    state = 'playing'; Ads.gameplayStart();
    tourMark();
    var pl = store.get('plays:' + cfg.id, 0); store.set('plays:' + cfg.id, (typeof pl === 'number' ? pl : 0) + 1);
    var rec = store.get('recent', []); if (!Array.isArray(rec)) rec = [];
    rec = rec.filter(function (r) { return r && r.id !== cfg.id; }); rec.unshift({ id: cfg.id, t: Date.now() }); store.set('recent', rec.slice(0, 12));
  }
  function pause() {
    if (state !== 'playing') return;
    state = 'paused'; Ads.gameplayStop(); ptrs = {};
    if (game.pointerCancel) game.pointerCancel(K);
    screen('pauseScr', '<div class="card"><h2>' + esc(K.t('paused')) + '</h2><div class="col">' +
      '<button class="btn big mint" id="bResume">' + ICON.play + esc(K.t('resume')) + '</button>' +
      '<button class="btn" id="bRestart">' + ICON.redo + esc(K.t('restart')) + '</button>' +
      '<div class="row"><button class="btn ghost" id="bHome">' + ICON.home + esc(K.t('home')) + '</button><button class="btn icon" id="bSoundP"></button></div></div></div>', true);
    $('bResume').onclick = function () { sfx('click'); resume(); };
    $('bRestart').onclick = function () { sfx('click'); startRound(); };
    $('bHome').onclick = function () { sfx('click'); showMenu(); };
    $('bSoundP').onclick = toggleSound; refreshSoundBtns();
    try { $('bResume').focus({ preventScroll: true }); } catch (e) { }
  }
  function resume() { if (state !== 'paused') return; closeScreens(); state = 'playing'; Ads.gameplayStart(); }

  function overExtra(isNew, best) {
    var h = '';
    if (!isNew && best > 0 && K.score < best) {
      var pct = Math.max(3, Math.min(100, Math.round(K.score / best * 100)));
      h += '<div class="tobeat"><span>' + esc(K.t('toBeat').replace('{n}', fmt(best - K.score + 1))) + '</span><i><b style="width:' + pct + '%"></b></i></div>';
    }
    var g = goalInfo();
    if (g && !g.done) h += '<p class="goal small">' + curIcon() + '<span>' + esc(K.t('goal')) + ': <b>' + fmt(Math.min(K.score, g.target)) + ' / ' + fmt(g.target) + '</b></span><em>+' + GOAL_COINS + '</em></p>';
    return h;
  }
  function showOver() {
    state = 'over';
    var rate = cfg.coinRate || 0.02;
    var bonus = Math.max(0, Math.floor(K.score * rate) - bonusPaid); bonusPaid += bonus;
    if (bonus > 0) K.addCoins(bonus);
    var best = bestScore(), isNew = K.score > best && K.score > 0;
    if (isNew) { store.set('best:' + cfg.id, K.score); confetti(90); sfx('star'); }
    var canRevive = overInfo.canRevive !== false && typeof game.revive === 'function' && !K.revived;
    screen('overScr', '<div class="card">' + bubziSVG(isNew ? 'happy' : 'sad', 84) + '<h2>' + esc(overInfo.title || K.t('over')) + '</h2>' +
      (isNew ? '<span class="badge">' + esc(K.t('newBest')) + '</span>' : '') +
      '<div class="row"><div class="stat"><b>' + fmt(K.score) + '</b><span>' + esc(K.t('score')) + '</span></div>' +
      '<div class="stat"><b>' + fmt(Math.max(best, K.score)) + '</b><span>' + esc(K.t('best')) + '</span></div>' +
      '<div class="stat"><b>+' + fmt(K.coinsRound) + '</b><span>' + esc(curName()) + '</span></div></div>' + overExtra(isNew, best) +
      '<div class="col">' + (canRevive ? '<button class="btn mint" id="bCont">' + ICON.tv + esc(K.t('cont')) + '</button>' : '') +
      '<button class="btn big" id="bAgain">' + ICON.redo + esc(K.t('playAgain')) + '</button>' +
      '<button class="btn ghost" id="bMenu">' + ICON.home + esc(K.t('home')) + '</button></div></div>', true);
    if ($('bCont')) $('bCont').onclick = function () {
      sfx('click');
      Ads.rewarded(function (ok) {
        if (!ok || state !== 'over') return;
        closeScreens(); K.revived = true; ptrs = {}; game.revive(K); state = 'playing'; Ads.gameplayStart(); sfx('reward'); updateHud(false);
      });
    };
    $('bAgain').onclick = function () {
      sfx('click'); roundsSinceAd++;
      if (roundsSinceAd >= 2) { roundsSinceAd = 0; Ads.interstitial(function () { startRound(); }); } else startRound();
    };
    $('bMenu').onclick = function () { sfx('click'); showMenu(); };
    updateHud(false);
    try { $('bAgain').focus({ preventScroll: true }); } catch (e) { }
  }

  /* Placeholder ad overlay — remove once a real ad network is connected */
  function placeholderAd(kind, done) {
    var prev = state; state = 'ad';
    var secs = TEST ? 0.2 : (kind === 'rewarded' ? 5 : 3), left = secs, finished = false;
    var s = el('div', { 'class': 'screen', id: 'ad', role: 'dialog', 'aria-label': K.t('ad') },
      '<div class="adbox"><b>AD PLACEHOLDER</b><span>' + esc(K.t(kind === 'rewarded' ? 'adReward' : 'adInter')) + '</span><div class="count" id="adCount">' + Math.ceil(left) + '</div></div>' +
      (kind === 'rewarded' ? '<button class="btn ghost" id="adSkip">' + esc(K.t('skip')) + '</button>' : ''));
    stage.appendChild(s);
    function finish(ok) {
      if (finished) return; finished = true; clearInterval(iv); if (s.parentNode) s.remove();
      state = prev; done(ok);
    }
    var iv = setInterval(function () {
      left -= 0.1; var c = $('adCount'); if (c) c.textContent = Math.max(0, Math.ceil(left));
      if (left <= 0) { if (kind === 'rewarded') toast(K.t('reward')); finish(true); }
    }, 100);
    if ($('adSkip')) $('adSkip').onclick = function () { finish(false); };
  }

  /* ---------------- input ---------------- */
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function bindInput() {
    canvas.addEventListener('pointerdown', function (e) {
      unlockAudio();
      if (state !== 'playing') return;
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
      var p = pos(e); ptrs[e.pointerId] = { x0: p.x, y0: p.y, swiped: false };
      if (game.pointerDown) game.pointerDown(p.x, p.y, K, e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (state !== 'playing') return;
      var p = pos(e), pt = ptrs[e.pointerId];
      if (pt && !pt.swiped && game.swipe) {
        var dx = p.x - pt.x0, dy = p.y - pt.y0;
        if (Math.sqrt(dx * dx + dy * dy) > 26) { pt.swiped = true; game.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'), K); }
      }
      if (game.pointerMove) game.pointerMove(p.x, p.y, K, e.pointerId, !!pt);
    });
    function up(e) {
      var had = !!ptrs[e.pointerId]; delete ptrs[e.pointerId];
      if (state !== 'playing' || !had) return;
      var p = pos(e); if (game.pointerUp) game.pointerUp(p.x, p.y, K, e.pointerId);
    }
    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    var GAMEKEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
    window.addEventListener('keydown', function (e) {
      unlockAudio();
      if (e.key && e.key.length === 1 && !(e.target && e.target.tagName === 'INPUT')) { typed = (typed + e.key.toLowerCase()).slice(-CREATOR_CODE.length); if (typed === CREATOR_CODE) { typed = ''; creatorEnter(CREATOR_CODE); } } // CREATOR
      var c = e.code;
      if (state === 'playing') {
        if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); pause(); return; }
        if (GAMEKEYS.indexOf(c) >= 0) e.preventDefault();
        if (game.key) game.key(c, true, K, e.repeat);
      } else if (state === 'paused' && (c === 'Escape' || c === 'KeyP')) { e.preventDefault(); resume(); }
      else if (state === 'menu' && (c === 'Space' || c === 'Enter') && (document.activeElement === document.body || document.activeElement === $('bPlay'))) { e.preventDefault(); sfx('click'); startRound(); }
    });
    window.addEventListener('keyup', function (e) { if (state === 'playing' && game.key) game.key(e.code, false, K, false); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
    window.addEventListener('blur', function () { if (!TEST) pause(); });
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  }
  function resize() {
    var r = stage.getBoundingClientRect();
    var W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height)), nd = Math.min(2.5, window.devicePixelRatio || 1);
    if (W === K.W && H === K.H && nd === dpr && canvas.width) return;
    K.W = W; K.H = H; dpr = nd;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    if (game && game.resize) game.resize(K);
  }

  /* ---------------- loop ---------------- */
  var last = 0;
  function step(dt) {
    K.time += dt; K.dt = dt;
    if (state === 'playing') game.update(dt, K);
    else if (game.idle && (state === 'menu' || state === 'dying')) game.idle(dt, K, state);
    updateParts(dt);
    shakeMag *= Math.pow(0.0015, dt); if (shakeMag < 0.2) shakeMag = 0;
    flashA = Math.max(0, flashA - dt * 2.5);
    if (state === 'dying') { dyingT -= dt; if (dyingT <= 0) showOver(); }
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, K.W, K.H);
    ctx.save();
    if (shakeMag > 0) ctx.translate(rand(-shakeMag, shakeMag), rand(-shakeMag, shakeMag));
    game.draw(ctx, K, state);
    drawParts(ctx);
    ctx.restore();
    if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, K.W, K.H); ctx.globalAlpha = 1; }
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    var raw = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
    for (var i = 0; i < SPEED; i++) step(raw);
    render();
  }

  /* ---------------- boot ---------------- */
  window.BubziKit = {
    run: function (g) {
      game = g; cfg = g;
      var l = Q.get('lang') || store.get('lang', null) || (navigator.language || 'en').slice(0, 2).toLowerCase();
      K.lang = LANGS.indexOf(l) >= 0 ? l : 'en'; K.rtl = K.lang === 'ar';
      var th = cfg.theme || Q.get('theme') || store.get('theme', null); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);
      buildDom(); bindInput(); resize();
      if (game.init) game.init(K);
      if (store.get('creator:' + cfg.id, false)) creatorApply(); // CREATOR
      game.reset(K);
      showMenu();
      if (AUTOSTART) startRound();
      Ads.loadingFinished();
      requestAnimationFrame(frame);
      window.__bubzi = { K: K, game: game, start: startRound, menu: showMenu, pause: pause, resume: resume,
        over: function () { K.gameOver(); }, state: function () { return state; }, parts: function () { return parts.length; } };
    }
  };
})();

</script>
<script>
/* Tiny Siege — original lane war game for Bubzi.
   Send miners for gold, spend it on stick fighters, and knock down the enemy tower before they knock down yours. */
(function () {
  'use strict';
  var KINDS = ['miner', 'sword', 'archer', 'giant'];
  var T = {

    revive: function (K) { myHp = Math.round(MYMAX * 0.6); units = units.filter(function (q) { return q.side === 0 || q.x > 0.55; }); phase = 'play'; phaseT = 0; },
    pointerDown: function (x, y, K) {

    },
    key: function (code, down, K, rep) {

    },
    update: function (dt, K) {
      if (K.test && K.fastX) dt *= K.fastX;

      KINDS.forEach(function (k) { cds[k] = Math.max(0, cds[k] - dt); foeCd[k] = Math.max(0, foeCd[k] - dt); });

      });
      if (phase === 'win' && phaseT > 2) { level++; newLevel(K, false); }
      if (phase === 'lost' && phaseT > 1.2) { K.gameOver({}); return; }
      K.info(K.t('level') + ' ' + level);
    },
    draw: function (ctx, K, state) {
      var x, g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#9FDCFF'); g.addColorStop(0.55, '#E4F6FF'); g.addColorStop(1, '#FFF1D0'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (var c = 0; c < 3; c++) { var cx = ((c * 0.37 + K.time * 0.008 * (1 + c * 0.4)) % 1.2 - 0.1) * W, cy = sceneTop + 20 + c * 26; ctx.beginPath(); ctx.arc(cx, cy, 16, 0, K.TAU); ctx.arc(cx + 18, cy - 6, 20, 0, K.TAU); ctx.arc(cx + 38, cy, 15, 0, K.TAU); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,230,120,0.9)'; ctx.beginPath(); ctx.arc(W * 0.5, sceneTop + (groundY - sceneTop) * 0.3, u * 0.9, 0, K.TAU); ctx.fill();
      ctx.fillStyle = '#E0F2E4'; ctx.beginPath(); ctx.moveTo(0, groundY); for (x = 0; x <= W + 20; x += 20) ctx.lineTo(x, groundY - (groundY - sceneTop) * 0.42 - Math.sin(x * 0.006 + 1) * u * 1.2); ctx.lineTo(W + 20, groundY); ctx.fill();
      ctx.fillStyle = '#CDEFD0'; ctx.beginPath(); ctx.moveTo(0, groundY); for (x = 0; x <= W + 20; x += 20) ctx.lineTo(x, groundY - u * 2.2 - Math.sin(x * 0.01) * u * 0.7); ctx.lineTo(W + 20, groundY); ctx.fill();

      var bandB = groundY + u * (front + 0.5);
      ctx.fillStyle = '#E3C48F'; ctx.fillRect(0, groundY - u * 0.4, W, bandB - groundY + u * 0.4);
      ctx.fillStyle = 'rgba(160,120,60,0.18)'; for (var r2 = 0; r2 < 3; r2++) for (x = (r2 * 17) % 34; x < W; x += 34) ctx.fillRect(x, groundY + u * (0.1 + r2 * front * 0.4), 14, 3);
      ctx.fillStyle = '#5BBF3A'; ctx.fillRect(0, bandB, W, H);
      ctx.fillStyle = '#F4EEFF'; ctx.fillRect(0, infoY - 22, W, H);
      ctx.fillStyle = 'rgba(36,27,77,0.08)'; ctx.fillRect(0, infoY - 22, W, 3);
      // hold line
      if (mode === 'hold') { ctx.strokeStyle = 'rgba(123,77,255,0.45)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(lx(HOLD) + u * 0.5, groundY - u * 0.4); ctx.lineTo(lx(HOLD) + u * 0.5, groundY + u * (front + 0.4)); ctx.stroke(); ctx.setLineDash([]); }

      drawTower(ctx, K, tx0, 0, myHp, MYMAX); drawTower(ctx, K, tx1, 1, foeHp, foeMax);

      var list = units.map(function (q) { return { q: q, a: 1, f: 0 }; }).concat(dead.map(function (d) { return { q: d.q, a: 1 - d.t / 0.8, f: Math.min(1, d.t * 3) }; }));
      list.sort(function (a, b) { return a.q.dy - b.q.dy; });
      list.forEach(function (it) {
        var q = it.q, s = u / 40 * T[q.kind].size, px = lx(q.x), py = groundY + q.dy * u;
        ctx.fillStyle = 'rgba(36,27,77,0.15)'; ctx.beginPath(); ctx.ellipse(px, py, 9 * s, 3 * s, 0, 0, K.TAU); ctx.fill();
        drawStick(ctx, K, px, py, s, q.side, q.kind, q.face || (q.side ? -1 : 1), q.anim, q.atk, q.hurt, q.carry, it.a, it.f);
        if (!it.f && q.hp < q.max) { var bw = 22 * s; ctx.fillStyle = 'rgba(36,27,77,0.25)'; ctx.fillRect(px - bw / 2, py - 46 * s, bw, 4); ctx.fillStyle = TEAM[q.side].c; ctx.fillRect(px - bw / 2, py - 46 * s, bw * Math.max(0, q.hp / q.max), 4); }
      });
      arrows.forEach(function (a) {
        var k = Math.min(1, a.t / a.d), x = a.x + (a.tx - a.x) * k, y = a.y + (a.ty - a.y) * k - Math.sin(k * Math.PI) * u * 0.6, ang = Math.atan2(a.ty - a.y - Math.cos(k * Math.PI) * u * 0.6 * Math.PI, a.tx - a.x);
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.strokeStyle = '#6B4420'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(6, 0); ctx.stroke();
        ctx.fillStyle = '#C9D3E0'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3); ctx.fill(); ctx.restore();
      });
      // gold + mode toggle
      ctx.font = K.font(22); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; goldCoin(ctx, K, btns[0].x + 12, infoY, 11); ctx.fillStyle = '#241B4D'; ctx.fillText(K.fmt(Math.floor(gold)), btns[0].x + 30, infoY + 1);
      var mb = modeB, att = mode === 'attack';
      ctx.fillStyle = att ? '#C2362F' : '#3F2A9E'; K.roundRect(ctx, mb.x, mb.y + 3, mb.w, mb.h, mb.h / 2); ctx.fill();
      ctx.fillStyle = att ? '#FF6B5E' : '#7B4DFF'; K.roundRect(ctx, mb.x, mb.y, mb.w, mb.h, mb.h / 2); ctx.fill();
      ctx.font = K.font(15); ctx.textAlign = 'center'; ctx.fillStyle = '#FFFFFF'; ctx.fillText((att ? '» ' : '« ') + K.t(att ? 'attack' : 'hold') + (kb ? '  [H]' : ''), mb.x + mb.w / 2, mb.y + mb.h / 2 + 1);

      btns.forEach(function (b, i) {
        var t = T[b.k], can = gold >= t.cost && cds[b.k] <= 0 && phase === 'play' && (b.k === 'miner' ? count(0, 'miner') < MAXMINERS : count(0) < MAXARMY);
        ctx.fillStyle = can ? '#C9B8FF' : '#D7D2EA'; K.roundRect(ctx, b.x, b.y + 4, b.w, b.h, 16); ctx.fill();
        ctx.fillStyle = can ? '#FFFFFF' : '#ECE9F6'; K.roundRect(ctx, b.x, b.y, b.w, b.h, 16); ctx.fill();
        var s = b.h * 0.4 / 44 * (b.k === 'giant' ? 0.9 : 1);
        ctx.save(); if (!can) ctx.globalAlpha = 0.5; drawStick(ctx, K, b.x + b.w / 2, b.y + b.h * 0.7, s, 0, b.k, 1, 0, 0, 0, b.k === 'miner' ? 1 : 0, 1, 0); ctx.restore();
        ctx.font = K.font(Math.round(b.h * 0.18)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = can ? '#241B4D' : '#8A84A8';
        ctx.fillText(K.t(b.k), b.x + b.w / 2, b.y + b.h * 0.14 + 2);
        var cy = b.y + b.h * 0.86; goldCoin(ctx, K, b.x + b.w / 2 - 16, cy, 7); ctx.textAlign = 'left'; ctx.fillStyle = can ? '#241B4D' : '#8A84A8'; ctx.fillText(t.cost, b.x + b.w / 2 - 6, cy + 1);
        if (cds[b.k] > 0) { var f = cds[b.k] / t.cd; ctx.fillStyle = 'rgba(36,27,77,0.25)'; K.roundRect(ctx, b.x, b.y + b.h * (1 - f), b.w, b.h * f, 16); ctx.fill(); }
        if (b.k === 'miner') { ctx.font = K.font(12); ctx.fillStyle = '#5E5689'; ctx.textAlign = 'right'; ctx.fillText(count(0, 'miner') + '/' + MAXMINERS, b.x + b.w - 8, b.y + b.h * 0.42); }
        if (kb) { ctx.font = K.font(12); ctx.fillStyle = '#8A84A8'; ctx.textAlign = 'left'; ctx.fillText(i + 1, b.x + 8, b.y + b.h * 0.42); }
      });
      // tutorial: tap the sword button
      if (K.tutorial && state === 'playing') {
        var bb = btns[1], k = (tutT * 0.9) % 1;
        K.drawHand(ctx, bb.x + bb.w / 2, bb.y + bb.h * 0.55 + (k < 0.5 ? k : 1 - k) * 14, k > 0.4 && k < 0.6, Math.min(W, H) / 220);
      }
    }
  });
