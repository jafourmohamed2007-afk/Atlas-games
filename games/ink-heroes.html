html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;

.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:10px 12px;

.hud .score{font-size:40px;font-weight:800;color:var(--violet)}
.hud .info{margin-top:4px;padding:2px 10px;border-radius:12px;background:var(--panel);font-size:14px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.hud .info:empty{display:none}
.hud .side{display:flex;gap:8px;align-items:center}

.btn:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 var(--violet-d)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.big{min-height:72px;font-size:28px;padding:0 44px;border-radius:30px;box-shadow:0 7px 0 var(--violet-d)}

  function bindInput() {

      try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
      var p = pos(e); ptrs[e.pointerId] = { x0: p.x, y0: p.y, swiped: false };

    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);

  }

  /* ---------------- loop ---------------- */
  var last = 0;
  function step(dt) {
    K.time += dt; K.dt = dt;

  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, K.W, K.H);
    ctx.save();
    if (shakeMag > 0) ctx.translate(rand(-shakeMag, shakeMag), rand(-shakeMag, shakeMag));
    game.draw(ctx, K, state);
    drawParts(ctx);
    ctx.restore();
    if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashC; ctx.fillRect(0, 0, K.W, K.H); ctx.globalAlpha = 1; }
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    var raw = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
    for (var i = 0; i < SPEED; i++) step(raw);

  }

  /* ---------------- boot ---------------- */
  window.BubziKit = {
    run: function (g) {
      game = g; cfg = g;
      var l = Q.get('lang') || store.get('lang', null) || (navigator.language || 'en').slice(0, 2).toLowerCase();
      K.lang = LANGS.indexOf(l) >= 0 ? l : 'en'; K.rtl = K.lang === 'ar';
      var th = cfg.theme || Q.get('theme') || store.get('theme', null); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);
      buildDom(); bindInput(); resize();

      if (AUTOSTART) startRound();
      Ads.loadingFinished();
      requestAnimationFrame(frame);
      window.__bubzi = { K: K, game: game, start: startRound, menu: showMenu, pause: pause, resume: resume,
        over: function () { K.gameOver(); }, state: function () { return state; }, parts: function () { return parts.length; } };
    }
  };
})();
