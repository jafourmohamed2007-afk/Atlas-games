/* Bubzi Kit — shared "Jelly Pop" styles for every game */

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;

#stage{position:relative;flex:1;min-height:0;overflow:hidden}

/* ---------- AD PLACEHOLDER: BANNER (320x50) ---------- */
#banner{flex:0 0 auto;height:62px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#banner .slot{width:320px;max-width:calc(100% - 16px);height:50px;border:2px dashed #9A90C9;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel)}
#banner.off{display:none}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:10px 12px;
  pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.hud .mid{display:flex;flex-direction:column;align-items:center;line-height:1;pointer-events:none;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.hud .best{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.hud .score{font-size:40px;font-weight:800;color:var(--violet)}
.hud .info{margin-top:4px;padding:2px 10px;border-radius:12px;background:var(--panel);font-size:14px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.hud .info:empty{display:none}
.hud.noscore .best,.hud.noscore .score{display:none}
.hud.noscore .info{margin-top:6px}
.hud .side{display:flex;gap:8px;align-items:center}
.hidden{display:none !important}

.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 var(--violet-d)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.big{min-height:72px;font-size:28px;padding:0 44px;border-radius:30px;box-shadow:0 7px 0 var(--violet-d)}
.btn.big:active{box-shadow:0 2px 0 var(--violet-d)}

.btn.pink{background:var(--pink);box-shadow:0 5px 0 var(--pink-d)} .btn.pink:active{box-shadow:0 1px 0 var(--pink-d)}
