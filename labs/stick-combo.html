<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stick Combo Lab</title>
<style>
:root{--bg:#F7F5FF;--ground:#241B4D;--ink:#241B4D;--muted:#6E6890;--btn:#FFFFFF;--btnShadow:#C9B8FF;--p1:#2B3BE0;--p2:#13A85A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15112B;--ground:#E9E4FF;--ink:#F3F0FF;--muted:#A9A2CC;--btn:#2A2350;--btnShadow:#0B0820;--p1:#7C8BFF;--p2:#3BE08A}}
:root[data-theme="dark"]{--bg:#15112B;--ground:#E9E4FF;--ink:#F3F0FF;--muted:#A9A2CC;--btn:#2A2350;--btnShadow:#0B0820;--p1:#7C8BFF;--p2:#3BE08A}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ui button{font:800 17px/1 inherit;font-family:inherit;color:var(--ink);background:var(--btn);border:0;border-radius:16px;padding:15px 16px;min-width:78px;box-shadow:0 5px 0 var(--btnShadow);cursor:pointer;letter-spacing:.3px}
.ui button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btnShadow)}
.ui button.auto{background:#7B4DFF;color:#fff;box-shadow:0 5px 0 #4B2BB8}
.hint{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;text-align:center;color:var(--muted);font-size:14px;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Tap a move (or J / K / U). AUTO plays the full combo. Tap anywhere for sound.</div>
<div class="ui" id="ui">
  <button data-m="punch">👊 Punch</button>
  <button data-m="kick">🦵 Kick</button>
  <button data-m="upper">⬆️ Uppercut</button>
  <button data-m="auto" class="auto">▶ AUTO</button>
</div>
<script>
(function () {
'use strict';
/* =====================================================================
   Stick fighter animation lab.
   - Rig: hip root, torso, head, 2-bone arms and legs. Every joint angle is a
     damped spring chasing a key pose, so motion overshoots and settles on its own.
   - Hits add velocity to the victim's springs (whole-body recoil), knockback,
     launches, juggles, slams, bounces and knock-downs.
   - Fast limbs leave swept smear shapes; impacts get hit-stop, star sparks,
     rings, streaks, camera shake and zoom, and a combo counter.
   ===================================================================== */
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var Q = new URLSearchParams(location.search), CAPTURE = Q.has('capture');
var mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
var RM = function () { return Q.get('motion') === 'reduce' || !!(mq && mq.matches); };
var W = 1, H = 1, DPR = 1, COL = {};
function readColors() { var s = getComputedStyle(document.documentElement); ['bg', 'ground', 'ink', 'muted', 'p1', 'p2'].forEach(function (k) { COL[k] = s.getPropertyValue('--' + k).trim(); }); }
function resize() { DPR = Math.min(2.5, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); readColors(); }
addEventListener('resize', resize); if (mq) try { mq.addEventListener('change', readColors); } catch (e) { }
if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) { }
resize();

var SEED = (+Q.get('seed') || (Date.now() % 100000)) >>> 0, RNG = function () { SEED = (SEED + 0x6D2B79F5) >>> 0; var t = SEED; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
var TAU = Math.PI * 2, clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; }, rand = function (a, b) { return a + RNG() * (b - a); };
function shade(hex, k) { var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; var f = function (c) { return Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k); }; return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')'; }
var easeOutBack = function (k) { var c = 1.9, m = k - 1; return 1 + (c + 1) * m * m * m + c * m * m; };

/* ---------------- sound (tiny cartoon synth) ---------------- */
var AC = null, OUT = null;
function audio() {
  if (AC) return AC; var C = window.AudioContext || window.webkitAudioContext; if (!C || CAPTURE) return null;
  AC = new C(); OUT = AC.createGain(); OUT.gain.value = 0.55; var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 10000; OUT.connect(lp); lp.connect(AC.destination); return AC;
}
var NB = null;
function tone(f1, f2, dur, vol, drive) {
  var a = AC; if (!a) return; var t = a.currentTime, o = a.createOscillator(), g = a.createGain(), n = o;
  o.frequency.setValueAtTime(f1 * rand(0.94, 1.06), t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  if (drive) { var ws = a.createWaveShaper(), c = new Float32Array(512); for (var i = 0; i < 512; i++) { var x = i / 255.5 - 1; c[i] = Math.tanh(x * drive) / Math.tanh(drive); } ws.curve = c; o.connect(ws); n = ws; }
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.setTargetAtTime(0.0001, t + 0.01, dur / 4);
  n.connect(g); g.connect(OUT); o.start(t); o.stop(t + dur + 0.1);
}
function hiss(f1, f2, dur, vol, q, type) {
  var a = AC; if (!a) return; if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); var d = NB.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = RNG() * 2 - 1; }
  var t = a.currentTime, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = NB; s.loop = true; f.type = type || 'bandpass'; f.Q.value = q || 1; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(0.03, dur / 3)); g.gain.setTargetAtTime(0.0001, t + dur * 0.4, dur / 4);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t, RNG()); s.stop(t + dur + 0.1);
}
var SND = {
  whoosh: function () { hiss(500, 2100, 0.13, 0.16, 1.2); },
  whooshBig: function () { hiss(300, 1600, 0.2, 0.2, 0.9); },
  light: function () { tone(220, 70, 0.09, 0.5, 2); hiss(1600, 900, 0.04, 0.22, 0.8); },
  medium: function () { tone(170, 55, 0.13, 0.6, 2.5); hiss(1200, 500, 0.06, 0.28, 0.7); tone(520, 300, 0.05, 0.12); },
  heavy: function () { tone(130, 40, 0.22, 0.7, 3); hiss(900, 250, 0.14, 0.32, 0.6, 'lowpass'); tone(700, 350, 0.06, 0.12); },
  finisher: function () { tone(110, 32, 0.45, 0.8, 3.5); hiss(2200, 200, 0.4, 0.38, 0.5, 'lowpass'); tone(1046, 1046, 0.25, 0.08); },
  land: function () { tone(95, 40, 0.12, 0.45, 2); hiss(500, 200, 0.1, 0.18, 0.7, 'lowpass'); },
  step: function () { hiss(800, 400, 0.05, 0.06, 0.8); }
};
function snd(n) { if (AC && SND[n]) try { SND[n](); } catch (e) { } }
function unlock() { var a = audio(); if (a && a.state === 'suspended') a.resume(); var h = document.getElementById('hint'); if (h) h.textContent = 'Tap a move (or J / K / U). AUTO plays the full combo.'; }

/* ---------------- rig + poses ---------------- */
// Angles in radians, facing right, y down. dir(a) = (sin a, cos a): 0 = straight down, +PI/2 = forward.
// t torso lean (+ forward), h head tilt, a/e upper arm (world) and elbow bend (+ curls forward),
// l/k thigh (world) and knee bend (- folds the shin back). 1 = front limbs, 2 = back limbs.
var LEN = { torso: 30, neck: 4, head: 8.2, ua: 15.5, fa: 15.5, th: 20, sh: 20.5 };
var KEYS = ['t', 'h', 'a1', 'e1', 'a2', 'e2', 'l1', 'k1', 'l2', 'k2'];
function P(t, h, a1, e1, a2, e2, l1, k1, l2, k2) { return { t: t, h: h, a1: a1, e1: e1, a2: a2, e2: e2, l1: l1, k1: k1, l2: l2, k2: k2 }; }
var POSE = {
  stance:   P(0.10, 0.05, 0.55, 1.75, 0.25, 2.15, 0.40, -0.32, -0.34, -0.20),
  jabWind:  P(0.04, 0.05, 0.25, 2.45, 0.20, 2.20, 0.42, -0.34, -0.36, -0.22),
  jab:      P(0.24, -0.05, 1.62, 0.04, 0.32, 2.15, 0.48, -0.22, -0.46, -0.10),
  cross:    P(0.34, -0.08, 0.45, 1.95, 1.58, 0.03, 0.52, -0.36, -0.52, -0.04),
  fkChamb:  P(-0.06, 0.05, 0.95, 1.55, -0.25, 2.05, 1.78, -2.35, -0.06, -0.06),
  fkExt:    P(-0.30, 0.12, 0.72, 1.35, -0.55, 1.55, 1.50, -0.02, -0.10, -0.02),
  hkChamb:  P(-0.36, 0.10, 1.05, 1.40, -0.65, 1.20, 2.15, -2.25, -0.10, 0.00),
  hkExt:    P(-0.66, 0.28, 0.55, 1.00, -1.05, 0.80, 2.20, -0.02, -0.14, 0.00),
  upCrouch: P(0.48, -0.12, 0.20, 1.95, -0.45, 2.35, 0.95, -1.35, -0.22, -1.05),
  upper:    P(-0.20, 0.30, 0.40, 1.90, 2.80, 0.30, 0.16, -0.05, -0.26, -0.06),
  tuck:     P(0.12, 0.05, 0.65, 1.60, 0.30, 2.00, 1.30, -2.05, 0.60, -1.85),
  airJab:   P(0.22, -0.05, 1.60, 0.04, 0.30, 2.10, 0.95, -1.55, 0.15, -1.40),
  airCross: P(0.32, -0.08, 0.40, 1.90, 1.55, 0.03, 1.05, -1.65, 0.10, -1.30),
  airKnee:  P(0.30, 0.00, 0.80, 1.60, -0.30, 1.90, 2.00, -2.50, 0.10, -0.90),
  axeUp:    P(-0.34, 0.20, 1.25, 0.80, -0.85, 1.00, 2.95, -0.08, 0.20, -0.85),
  axeDown:  P(0.40, -0.10, -0.40, 1.20, 0.95, 0.90, 0.95, -0.04, -0.30, -0.60),
  land:     P(0.34, -0.05, 0.50, 1.70, -0.20, 1.90, 0.85, -1.25, -0.32, -1.00),
  victory:  P(0.02, -0.12, 2.95, 0.25, 0.35, 1.25, 0.22, -0.12, -0.22, -0.10),
  // reactions
  hurtHead: P(-0.48, -0.55, -0.65, 0.60, -0.95, 0.40, 0.25, -0.22, -0.36, -0.30),
  hurtGut:  P(0.98, 0.45, 0.25, 0.85, 0.05, 1.05, 0.30, -0.62, -0.30, -0.52),
  tumble:   P(-0.62, -0.60, -1.85, 0.40, -2.45, 0.60, 0.92, -1.15, 0.42, -0.62),
  down:     P(0.00, 0.15, 0.75, 0.35, 0.95, 0.25, 0.10, -0.10, -0.06, -0.22),
  getUp:    P(0.70, -0.20, 0.40, 1.20, -0.10, 1.40, 1.00, -1.60, -0.30, -1.20)
};

function dir(a) { return [Math.sin(a), Math.cos(a)]; }
function spring(v) { return { v: v, w: 0 }; }

function Fighter(x, face, color) {
  this.x = x; this.x0 = x; this.xT = x; this.vx = 0; this.face = face; this.color = color;
  this.air = 0; this.vAir = 0; this.gS = 1; this.bounces = 0; this.grounded = true;
  this.rot = spring(0); this.rotT = 0;
  this.j = {}; for (var i = 0; i < KEYS.length; i++) this.j[KEYS[i]] = spring(POSE.stance[KEYS[i]]);
  this.target = POSE.stance; this.f = 8; this.z = 0.55;
  this.queue = []; this.cur = null; this.curT = 0; this.state = 'idle'; this.flash = 0; this.trails = { h1: [], h2: [], f1: [], f2: [] };
  this.pts = null; this.downT = 0; this.xSpring = false; this.seed = RNG() * 10; this.whip = 0; this.rotLock = false;
}
Fighter.prototype.setPose = function (p, f, z) { this.target = typeof p === 'string' ? POSE[p] : p; this.f = f || 8; this.z = z == null ? 0.55 : z; };
Fighter.prototype.busy = function () { return !!this.cur || this.queue.length > 0; };
Fighter.prototype.play = function (steps, replace) { if (replace) { this.queue = []; this.cur = null; } for (var i = 0; i < steps.length; i++) this.queue.push(steps[i]); };

// local joint positions (hip at origin), with whole-body rotation
Fighter.prototype.solve = function () {
  var j = this.j, v = function (k) { return j[k].v; };
  var t = v('t'), hip = [0, 0], neck = [Math.sin(t) * LEN.torso, -Math.cos(t) * LEN.torso];
  var hd = LEN.neck + LEN.head, head = [neck[0] + Math.sin(t + v('h')) * hd, neck[1] - Math.cos(t + v('h')) * hd];
  var sh = [neck[0] * 0.93, neck[1] * 0.93];
  function arm(a, e) { var d1 = dir(a), el = [sh[0] + d1[0] * LEN.ua, sh[1] + d1[1] * LEN.ua], d2 = dir(a + e); return [el, [el[0] + d2[0] * LEN.fa, el[1] + d2[1] * LEN.fa]]; }
  function leg(l, k) { var d1 = dir(l), kn = [d1[0] * LEN.th, d1[1] * LEN.th], d2 = dir(l + k); return [kn, [kn[0] + d2[0] * LEN.sh, kn[1] + d2[1] * LEN.sh]]; }
  var A1 = arm(v('a1'), v('e1')), A2 = arm(v('a2'), v('e2')), L1 = leg(v('l1'), v('k1')), L2 = leg(v('l2'), v('k2'));
  var P = { hip: hip, neck: neck, head: head, sh: sh, e1: A1[0], h1: A1[1], e2: A2[0], h2: A2[1], k1: L1[0], f1: L1[1], k2: L2[0], f2: L2[1] };
  var r = this.rot.v, c = Math.cos(r), s = Math.sin(r), low = -1e9;
  for (var n in P) { var p = P[n], x = p[0] * c - p[1] * s, y = p[0] * s + p[1] * c; P[n] = [x, y]; var lo = y + (n === 'head' ? LEN.head : 2); if (lo > low) low = lo; }
  P.low = low; return P;
};
// world position of a joint
Fighter.prototype.world = function (P, n) { return [this.x + this.face * P[n][0], GROUND - P.low - this.air + P[n][1]]; };

/* ---------------- moves ---------------- */
// step: { p: pose, d: seconds, f: spring Hz, z: damping, aim: where the strike must land, hit: contact strike, jump, sfx }
// A hit only happens when the striking hand / foot / knee physically touches the other body.
function aimG(p, from, mode) { return { p: p, from: from, mode: mode || 'edge' }; }
var MOVES = {
  jab: [{ p: 'jabWind', d: 0.07, f: 11, aim: aimG('jab', 'h1') }, { p: 'jab', d: 0.15, f: 17, z: 0.5, sfx: 'whoosh', aim: aimG('jab', 'h1'), hit: { from: 'h1', kind: 'head', power: 1 } }, { p: 'stance', d: 0.1, f: 9 }],
  cross: [{ p: 'cross', d: 0.17, f: 17, z: 0.5, sfx: 'whoosh', aim: aimG('cross', 'h2'), hit: { from: 'h2', kind: 'head', power: 1 } }, { p: 'stance', d: 0.1, f: 9 }],
  fkick: [{ p: 'fkChamb', d: 0.09, f: 14, noStep: 1, aim: aimG('fkExt', 'f1') }, { p: 'fkExt', d: 0.16, f: 18, z: 0.5, noStep: 1, sfx: 'whoosh', aim: aimG('fkExt', 'f1'), hit: { from: 'f1', kind: 'gut', power: 2 } }, { p: 'fkChamb', d: 0.07, f: 13, noStep: 1 }, { p: 'stance', d: 0.1, f: 9 }],
  hkick: [{ p: 'hkChamb', d: 0.1, f: 13, noStep: 1, aim: aimG('hkExt', 'f1') }, { p: 'hkExt', d: 0.19, f: 19, z: 0.45, noStep: 1, sfx: 'whooshBig', aim: aimG('hkExt', 'f1'), hit: { from: 'f1', kind: 'head', power: 3 } }, { p: 'stance', d: 0.16, f: 9 }],
  upper: [{ p: 'upCrouch', d: 0.12, f: 13, aim: aimG('upper', 'h2', 'under') }, { p: 'upper', d: 0.22, f: 18, z: 0.5, sfx: 'whooshBig', jump: 210, hit: { from: 'h2', kind: 'launch', power: 3 } }, { p: 'stance', d: 0.12, f: 9 }],
  airJab: [{ p: 'airJab', d: 0.17, f: 19, z: 0.5, sfx: 'whoosh', aim: aimG('airJab', 'h1', 'air'), hit: { from: 'h1', kind: 'air', power: 1 } }, { p: 'tuck', d: 0.05, f: 14, aim: aimG('airCross', 'h2', 'air') }],
  airCross: [{ p: 'airCross', d: 0.18, f: 19, z: 0.5, sfx: 'whoosh', aim: aimG('airCross', 'h2', 'air'), hit: { from: 'h2', kind: 'air', power: 2 } }, { p: 'tuck', d: 0.05, f: 14, aim: aimG('airJab', 'h1', 'air') }],
  airKnee: [{ p: 'airKnee', d: 0.18, f: 18, z: 0.5, sfx: 'whoosh', aim: aimG('airKnee', 'k1', 'air'), hit: { from: 'k1', kind: 'air', power: 2, lift: 1 } }, { p: 'tuck', d: 0.05, f: 14, aim: aimG('axeDown', 'f1', 'above') }],
  axe: [{ p: 'axeUp', d: 0.15, f: 14, noStep: 1, aim: aimG('axeDown', 'f1', 'above') }, { p: 'axeDown', d: 0.2, f: 22, z: 0.5, noStep: 1, sfx: 'whooshBig', aim: aimG('axeDown', 'f1', 'above'), hit: { from: 'f1', kind: 'slam', power: 4 } }, { p: 'tuck', d: 0.1, f: 10, untilLand: true }, { p: 'land', d: 0.2, f: 12 }, { p: 'stance', d: 0.2, f: 8 }],
  jumpIn: [{ p: 'tuck', d: 0.17, f: 12, jumpTo: { p: 'airJab', from: 'h1', T: 0.24 } }]
};
var AUTO = ['jab', 'cross', 'fkick', 'hkick', 'upper', 'jumpIn', 'airJab', 'airCross', 'airKnee', 'axe', 'win'];

/* ---------------- world ---------------- */
var GROUND = 0, G = 1900, LOG = [];
var A, B, fx = [], stopT = 0, slowT = 0, trauma = 0, zoomK = spring(1), cam = { x: 0, ox: 0, oy: 0 }, simT = 0;
var combo = { n: 0, t: 0, pop: 0, best: 0 }, impactT = 0, speedT = 0, autoOn = false, autoI = 0, autoWait = 0;
function reset() {
  readColors();
  A = new Fighter(-42, 1, 'p1'); B = new Fighter(42, -1, 'p2');
  fx = []; combo.n = 0; combo.t = 0; cam.x = 0;
}
reset();

function startStep(F, s) {
  F.cur = s; F.curT = 0; F.setPose(s.p, s.f, s.z); s._hit = false; s._done = false;
  if (s.jump) { F.vAir = s.jump; F.grounded = false; F.gS = 1; }
  if (s.jumpTo) planJump(F, F === A ? B : A, s.jumpTo);
  if (s.sfx) snd(s.sfx);
}

/* ---------- body geometry for contact ---------- */
function capsules(F) {
  var P = F.pts || (F.pts = F.solve()), w = function (n) { return F.world(P, n); };
  var hip = w('hip'), nk = w('neck'), hd = w('head');
  return [
    { a: hd, b: hd, r: LEN.head, part: 'head' }, { a: hip, b: nk, r: 4.6, part: 'torso' },
    { a: w('sh'), b: w('e1'), r: 2.8, part: 'arm' }, { a: w('e1'), b: w('h1'), r: 2.8, part: 'arm' },
    { a: w('sh'), b: w('e2'), r: 2.8, part: 'arm' }, { a: w('e2'), b: w('h2'), r: 2.8, part: 'arm' },
    { a: hip, b: w('k1'), r: 3.4, part: 'leg' }, { a: w('k1'), b: w('f1'), r: 3.2, part: 'leg' },
    { a: hip, b: w('k2'), r: 3.4, part: 'leg' }, { a: w('k2'), b: w('f2'), r: 3.2, part: 'leg' }
  ];
}
function closest(a, b, p) { var dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy, t = L ? clamp(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L, 0, 1) : 0; return [a[0] + dx * t, a[1] + dy * t]; }
var EFF_R = { h1: 3.2, h2: 3.2, f1: 3.6, f2: 3.6, k1: 4.2, k2: 4.2 };
function touch(E, er, vic, skipLimbs) {
  var best = null, caps = capsules(vic);
  for (var i = 0; i < caps.length; i++) {
    var c = caps[i]; if (skipLimbs && c.part === 'arm') continue;
    var q = closest(c.a, c.b, E), d = Math.hypot(E[0] - q[0], E[1] - q[1]), pen = c.r + er - d;
    if (pen > 0 && (!best || pen > best.pen)) { var nx = d > 1e-4 ? (E[0] - q[0]) / d : 1, ny = d > 1e-4 ? (E[1] - q[1]) / d : 0; best = { pen: pen, part: c.part, n: [nx, ny], pt: [q[0] + nx * c.r, q[1] + ny * c.r], cap: c }; }
  }
  return best;
}
// x of the front surface of a body at height y (the side facing the attacker)
function frontEdge(vic, y, face) {
  var caps = capsules(vic), best = null;
