<body>
<x-dc>
<helmet>

<div style="display: flex; flex-direction: column; align-items: center; line-height: 1">

<span style="font-family: 'Lilita One', sans-serif; font-size: 42px; color: #FFFFFF; text-shadow: 0 0 14px rgba(46,230,255,0.8)">2,480</span>

<div style="display: flex; gap: 8px">
<div style="display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 10px; border-radius: 14px; background: #19143A; border: 1.5px solid #3A3275; font-weight: 800; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FFC23D" stroke="#FFE08A"></circle><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4" stroke="#5C3F14"></path></svg>
<span>1,290</span>
</div>

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2EE6FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
</button>
</div>
</header>

<div style="width: 100%; display: flex; align-items: center; gap: 10px">
<svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
<line x1="32" y1="4" x2="32" y2="13" stroke="#FF3D9A" stroke-width="3"></line>
<circle cx="32" cy="5" r="4" fill="#FF3D9A"></circle>
<circle cx="32" cy="38" r="25" fill="#2A2260" stroke="#2EE6FF" stroke-width="3"></circle>
<rect x="14" y="28" width="36" height="18" rx="9" fill="#0D0A1E"></rect>
<path d="M19 39 Q24 32 29 39" stroke="#B6FF3B" stroke-width="3" fill="none" stroke-linecap="round"></path>
<path d="M35 39 Q40 32 45 39" stroke="#B6FF3B" stroke-width="3" fill="none" stroke-linecap="round"></path>
<path d="M25 51 Q32 58 39 51" stroke="#B6FF3B" stroke-width="3" fill="none" stroke-linecap="round"></path>
</svg>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800"><span style="color: #FF3D9A">COMBO x3  +360</span><span style="color: #A9A3D6">Level 7</span></div>
<div style="height: 10px; border-radius: 5px; background: #19143A; border: 1px solid #3A3275"><div style="width: 72%; height: 10px; border-radius: 5px; background: #B6FF3B; box-shadow: 0 0 10px rgba(182,255,59,0.8)"></div></div>
</div>
</div>

<div style="position: relative; width: 358px; height: 358px; box-sizing: border-box; padding: 9px; border-radius: 22px; background: #140F30; border: 2px solid #2EE6FF; box-shadow: 0 0 26px rgba(46,230,255,0.35)">
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; width: 336px; height: 336px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
<div style="{{c.style}}"></div>
</sc-for>
</div>
<svg width="358" height="60" viewBox="0 0 358 60" aria-hidden="true" style="position: absolute; left: 0; top: 158px">
<circle cx="30" cy="10" r="3" fill="#B6FF3B"></circle><circle cx="74" cy="52" r="2.5" fill="#FF3D9A"></circle><circle cx="140" cy="6" r="3.5" fill="#2EE6FF"></circle><circle cx="210" cy="54" r="3" fill="#FFC23D"></circle><circle cx="268" cy="8" r="2.5" fill="#C08BFF"></circle><circle cx="330" cy="48" r="3.5" fill="#B6FF3B"></circle>
<path d="M104 46 v12 M98 52 h12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
<path d="M300 0 v12 M294 6 h12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
</svg>
</div>

<section aria-label="Next pieces" style="width: 100%; display: flex; justify-content: space-around; align-items: center; height: 124px; border-radius: 20px; background: #19143A; border: 1.5px solid #3A3275; position: relative">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; width: 61px; opacity: 0.35">
<div style="height: 29px; border-radius: 6px; border: 2px solid #FFC23D; box-sizing: border-box"></div><div style="height: 29px; border-radius: 6px; border: 2px solid #FFC23D; box-sizing: border-box"></div>
<div style="height: 29px; border-radius: 6px; border: 2px solid #FFC23D; box-sizing: border-box"></div><div style="height: 29px; border-radius: 6px; border: 2px solid #FFC23D; box-sizing: border-box"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; width: 93px">
<div style="height: 29px; border-radius: 6px; background: #B6FF3B; box-shadow: 0 0 10px rgba(182,255,59,0.7)"></div><div style="height: 29px"></div><div style="height: 29px"></div>
<div style="height: 29px; border-radius: 6px; background: #B6FF3B; box-shadow: 0 0 10px rgba(182,255,59,0.7)"></div><div style="height: 29px; border-radius: 6px; background: #B6FF3B; box-shadow: 0 0 10px rgba(182,255,59,0.7)"></div><div style="height: 29px; border-radius: 6px; background: #B6FF3B; box-shadow: 0 0 10px rgba(182,255,59,0.7)"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; width: 29px">
<div style="height: 29px; border-radius: 6px; background: #FF3D9A; box-shadow: 0 0 10px rgba(255,61,154,0.7)"></div>
<div style="height: 29px; border-radius: 6px; background: #FF3D9A; box-shadow: 0 0 10px rgba(255,61,154,0.7)"></div>
<div style="height: 29px; border-radius: 6px; background: #FF3D9A; box-shadow: 0 0 10px rgba(255,61,154,0.7)"></div>
</div>
<svg width="54" height="60" viewBox="0 0 24 28" aria-hidden="true" style="position: absolute; left: 70px; top: 50px">
<path d="M9 2.5a2 2 0 0 1 4 0V12l1-.2a2 2 0 0 1 2.2 1.3l.1.2a2 2 0 0 1 2.7 1.2 2 2 0 0 1 2.5 1.6l.3 3.4a6 6 0 0 1-1.8 4.8L18 26H9.5l-5-6.2a2 2 0 0 1 2.8-2.8L9 18.5Z" fill="#F3F0FF" stroke="#0D0A1E" stroke-width="1.4" stroke-linejoin="round"></path>
</svg>
</section>

<span style="font-size: 14px; font-weight: 800; color: #A9A3D6; letter-spacing: 0.5px">Drag a shape onto the board</span>

<aside aria-label="Advertisement" style="position: absolute; left: 35px; bottom: 12px; width: 320px; height: 50px; box-sizing: border-box; border: 2px dashed #5A5296; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #A9A3D6; background: #120E2A">AD SLOT · 320×50 banner</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var rows = ['PP...OO.', 'Pgg.MOO.', '.gg.MM.G', '.....M.G', '********', '..PP..MM', 'O.PP.GMM', 'OOO.GGG.'];
var col = { P: ['#C08BFF', 'rgba(192,139,255,0.6)'], O: ['#FFC23D', 'rgba(255,194,61,0.6)'], M: ['#B6FF3B', 'rgba(182,255,59,0.6)'], G: ['#FF3D9A', 'rgba(255,61,154,0.6)'] };
var cells = [];
rows.forEach(function (r) {
r.split('').forEach(function (ch) {
var base = 'border-radius: 7px; box-sizing: border-box; ';
var s;
if (ch === '.') s = base + 'background: #1C1640; border: 1px solid #2C2560;';
else if (ch === 'g') s = base + 'border: 2px dashed #B6FF3B; background: rgba(182,255,59,0.08);';
else if (ch === '*') s = base + 'background: #FFFFFF; box-shadow: 0 0 16px 5px rgba(46,230,255,0.9);';
else s = base + 'background: ' + col[ch][0] + '; box-shadow: 0 0 10px ' + col[ch][1] + ', inset 0 0 0 2px rgba(255,255,255,0.35);';
cells.push({ style: s });
});
});
return { cells: cells };
}
}
</script>
</body>
</html>
