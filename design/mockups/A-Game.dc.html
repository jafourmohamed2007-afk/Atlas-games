<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jelly Pop Block Bloom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A22C9}a:hover{color:#2E128A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2EEFF; font-family: 'Baloo 2', system-ui, sans-serif; color: #241B4D; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 12px 16px; gap: 12px">

<header style="width: 100%; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Pause" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 0 #DCD3FF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#5A2EE8" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="2"></rect><rect x="14" y="4" width="5" height="16" rx="2"></rect></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center; line-height: 1">
<span style="font-size: 13px; font-weight: 700; color: #5E5689; letter-spacing: 1px">BEST 3,120</span>
<span style="font-size: 42px; font-weight: 800; color: #5A2EE8">2,480</span>
</div>
<div style="display: flex; gap: 8px">
<div style="display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 10px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 0 #DCD3FF; font-weight: 800; font-size: 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FFC93C" stroke="#E07A00"></circle><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4" stroke="#7A4200"></path></svg>
<span>1,290</span>
</div>
<button aria-label="Sound on" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 0 #DCD3FF; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A2EE8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z" fill="#5A2EE8"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
</button>
</div>
</header>

<div style="width: 100%; height: 56px; position: relative; display: flex; align-items: center; justify-content: center">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 18px; border-radius: 22px; background: #FF5FA2; box-shadow: 0 4px 0 #D43D80; color: #FFFFFF; transform: rotate(-4deg)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#FFE07A" aria-hidden="true"><path d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.5 6.8L12 17l-5.5 3.5L8 13.7 3 9.3l6.4-.7Z"></path></svg>
<span style="font-size: 24px; font-weight: 800">Combo x3!</span>
<span style="font-size: 18px; font-weight: 700; color: #FFF3B0">+360</span>
</div>
<svg width="62" height="62" viewBox="0 0 64 64" aria-hidden="true" style="position: absolute; right: 2px; top: -4px">
<path d="M32 10 C36 4 44 4 44 9 C40 9 36 11 34 14" fill="#14C8A0"></path>
<path d="M32 14 C50 14 58 28 58 40 C58 52 47 58 32 58 C17 58 6 52 6 40 C6 28 14 14 32 14 Z" fill="#7B4DFF"></path>
<ellipse cx="22" cy="24" rx="7" ry="4" fill="#FFFFFF" opacity="0.55"></ellipse>
<path d="M17 37 Q23 31 29 37" stroke="#241B4D" stroke-width="3" fill="none" stroke-linecap="round"></path>
<path d="M35 37 Q41 31 47 37" stroke="#241B4D" stroke-width="3" fill="none" stroke-linecap="round"></path>
<ellipse cx="15" cy="45" rx="4" ry="2.5" fill="#FF8FC4"></ellipse><ellipse cx="49" cy="45" rx="4" ry="2.5" fill="#FF8FC4"></ellipse>
<path d="M25 44 Q32 54 39 44 Z" fill="#241B4D"></path>
</svg>
</div>

<div style="position: relative; width: 358px; height: 358px; box-sizing: border-box; padding: 9px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 6px 0 #DCD3FF">
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; width: 340px; height: 340px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
<div style="{{c.style}}"></div>
</sc-for>
</div>
<svg width="358" height="60" viewBox="0 0 358 60" aria-hidden="true" style="position: absolute; left: 0; top: 160px">
<circle cx="30" cy="10" r="4" fill="#FFC93C"></circle><circle cx="74" cy="52" r="3" fill="#FF5FA2"></circle><circle cx="140" cy="6" r="5" fill="#14C8A0"></circle><circle cx="210" cy="54" r="4" fill="#FFC93C"></circle><circle cx="268" cy="8" r="3" fill="#7B4DFF"></circle><circle cx="330" cy="48" r="5" fill="#FF8A1F"></circle>
<path d="M104 50 l2 4 4 .5 -3 3 .8 4 -3.8 -2 -3.8 2 .8 -4 -3 -3 4 -.5Z" fill="#FFC93C"></path>
<path d="M300 4 l2 4 4 .5 -3 3 .8 4 -3.8 -2 -3.8 2 .8 -4 -3 -3 4 -.5Z" fill="#FFC93C"></path>
</svg>
</div>

<section aria-label="Next pieces" style="width: 100%; display: flex; justify-content: space-around; align-items: center; height: 124px; border-radius: 24px; background: #E7E0FF; position: relative">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; width: 61px; opacity: 0.45">
<div style="height: 29px; border-radius: 8px; background: #FF8A1F"></div><div style="height: 29px; border-radius: 8px; background: #FF8A1F"></div>
<div style="height: 29px; border-radius: 8px; background: #FF8A1F"></div><div style="height: 29px; border-radius: 8px; background: #FF8A1F"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; width: 93px">
<div style="height: 29px; border-radius: 8px; background: #14C8A0; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18)"></div><div style="height: 29px"></div><div style="height: 29px"></div>
<div style="height: 29px; border-radius: 8px; background: #14C8A0; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18)"></div><div style="height: 29px; border-radius: 8px; background: #14C8A0; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18)"></div><div style="height: 29px; border-radius: 8px; background: #14C8A0; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18)"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; width: 29px">
<div style="height: 29px; border-radius: 8px; background: #FF5FA2; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18)"></div>
<div style="height: 29px; border-radius: 8px; background: #FF5FA2; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18)"></div>
<div style="height: 29px; border-radius: 8px; background: #FF5FA2; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18)"></div>
</div>
<svg width="54" height="60" viewBox="0 0 24 28" aria-hidden="true" style="position: absolute; left: 70px; top: 50px">
<path d="M9 2.5a2 2 0 0 1 4 0V12l1-.2a2 2 0 0 1 2.2 1.3l.1.2a2 2 0 0 1 2.7 1.2 2 2 0 0 1 2.5 1.6l.3 3.4a6 6 0 0 1-1.8 4.8L18 26H9.5l-5-6.2a2 2 0 0 1 2.8-2.8L9 18.5Z" fill="#FFFFFF" stroke="#241B4D" stroke-width="1.4" stroke-linejoin="round"></path>
</svg>
</section>

<span style="font-size: 15px; font-weight: 700; color: #5E5689">Drag a shape onto the board</span>

<aside aria-label="Advertisement" style="position: absolute; left: 35px; bottom: 12px; width: 320px; height: 50px; box-sizing: border-box; border: 2px dashed #9A90C9; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #5E5689; background: #FFFFFF">AD SLOT · 320×50 banner</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var rows = ['PP...OO.', 'Pgg.MOO.', '.gg.MM.G', '.....M.G', '********', '..PP..MM', 'O.PP.GMM', 'OOO.GGG.'];
var col = { P: '#7B4DFF', O: '#FF8A1F', M: '#14C8A0', G: '#FF5FA2' };
var cells = [];
rows.forEach(function (r) {
r.split('').forEach(function (ch) {
var base = 'border-radius: 9px; box-sizing: border-box; ';
var s;
if (ch === '.') s = base + 'background: #ECE6FF;';
else if (ch === 'g') s = base + 'background: rgba(20,200,160,0.18); border: 2.5px dashed #14C8A0;';
else if (ch === '*') s = base + 'background: #FFE07A; box-shadow: 0 0 14px 4px rgba(255,201,60,0.85), inset 0 -4px 0 rgba(224,122,0,0.35);';
else s = base + 'background: ' + col[ch] + '; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.18), inset 0 4px 0 rgba(255,255,255,0.35);';
cells.push({ style: s });
});
});
return { cells: cells };
}
}
</script>
</body>
</html>
